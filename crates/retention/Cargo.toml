[package]
name = "retention"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal crates
storage = { path = "../storage" }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Serialization (model config YAML parsing + stats responses)
serde = { workspace = true }
serde_yaml = { workspace = true }

# Time handling for retention cutoffs
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Docker-backed run_once test (tests/cleanup_integration.rs)
test-utils = { path = "../test-utils", features = ["containers"] }
object_store = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
wms-common = { path = "../wms-common" }
