[package]
name = "netcdf-parser"
version.workspace = true
edition.workspace = true

[dependencies]
wms-common = { path = "../wms-common" }
bytes = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# NetCDF library for direct file reading (includes HDF5 via its own dependencies)
# System requirements: libhdf5-dev libnetcdf-dev
# hdf5-metno-sys 0.12 accepts HDF5 1.8.4+ and any 2.x (0.11.x rejected 2.2.0: its version
# regex only knew 2.0/2.1). netcdf-sys 0.9.2 requires ^0.12.2, so the graph has ONE copy.
netcdf = "0.12"

# HDF5 low-level bindings for silencing error output
# The HDF5 C library prints errors to stderr even when they're handled gracefully;
# we use H5Eset_auto2 to disable this verbose output
hdf5-metno-sys = "0.12"

[dev-dependencies]
# float_roundtrip: serde_json's default float parser can be 1 ulp off, which would make
# the exact lat/lon assertions in glm.rs fail for the wrong reason (harness, not decoder).
serde_json = { workspace = true, features = ["float_roundtrip"] }
