[package]
name = "ingester"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ingester"
path = "src/main.rs"

[dependencies]
# Internal crates
storage = { path = "../../crates/storage" }
ingestion = { path = "../../crates/ingestion" }
retention = { path = "../../crates/retention" }
trail-sync = { path = "../../crates/trail-sync" }
netcdf-parser = { path = "../../crates/netcdf-parser" }

# Async runtime
tokio = { workspace = true }

# HTTP server
axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# UUID for tracking
uuid = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
serde_json = { workspace = true }
# HTTP-level tests of /ingest/lightning against a real PostGIS (Docker in CI,
# or LIGHTNING_TEST_DATABASE_URL locally).
test-utils = { path = "../../crates/test-utils", features = ["containers"] }
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true }
