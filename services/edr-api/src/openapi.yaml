openapi: 3.0.3
info:
  title: Weather WMS EDR API
  version: 1.0.0
  description: |
    OGC API - Environmental Data Retrieval (EDR) for weather model data.
    
    This API provides access to weather data from multiple models including:
    - **GFS** - Global Forecast System (0.25° global coverage)
    - **HRRR** - High-Resolution Rapid Refresh (3km CONUS coverage)
    - **GOES-18/19** - Geostationary satellite imagery
    - **MRMS** - Multi-Radar Multi-Sensor precipitation
    - **METAR** - Aviation surface weather observations from airports
    - **TAF** - Terminal Aerodrome Forecasts (24-30 hour airport forecasts)
    
    ## Query Types
    
    The API supports the following EDR query patterns:
    - **Position** - Point sampling at a single location
    - **Area** - Polygon-based spatial queries  
    - **Radius** - Circle queries around a point
    - **Trajectory** - Sampling along a path with time
    - **Corridor** - Buffered path queries
    - **Cube** - Bounding box with vertical/temporal extent
    
    ## Trail conditions
    
    The `trails` collection serves OpenStreetMap trail geometry and, optionally, a
    physics-based soil-moisture advisory per trail segment. See the `/items` and
    `/items/{featureId}/conditions` operations. Coverage is currently a Front Range
    pilot region; outside it a trail has geometry but no `conditions`.
    
  contact:
    name: Weather WMS Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8083/edr
    description: Local development server

paths:
  /:
    get:
      operationId: getLandingPage
      summary: Landing page
      description: Returns the landing page with links to API resources
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPage'

  /api:
    get:
      operationId: getApiDefinition
      summary: OpenAPI definition
      description: Returns the OpenAPI 3.0 definition for this API
      responses:
        '200':
          description: OpenAPI definition
          content:
            application/openapi+json;version=3.0:
              schema:
                type: object

  /conformance:
    get:
      operationId: getConformance
      summary: Conformance declaration
      description: Returns the conformance classes implemented by this API
      responses:
        '200':
          description: Conformance declaration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conformance'

  /collections:
    get:
      operationId: getCollections
      summary: List collections
      description: Returns metadata about all available data collections
      responses:
        '200':
          description: Collections list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collections'

  /collections/{collectionId}:
    get:
      operationId: getCollection
      summary: Get collection metadata
      description: Returns metadata about a specific collection
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '404':
          description: Collection not found

  /collections/{collectionId}/position:
    get:
      operationId: getPosition
      summary: Position query
      description: Sample data at a single point location
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/coords'
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Data at the specified position
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/area:
    get:
      operationId: getArea
      summary: Area query
      description: |
        Sample data within a polygon area.
        
        When requesting PNG format (f=png or Accept: image/png), the response is a 16-bit 
        encoded PNG optimized for GPU shader consumption. This format encodes data values 
        into RGBA channels for efficient WebGL texture upload:
        - R+G channels: 16-bit normalized value (R=high byte, G=low byte)
        - B channel: Reserved
        - A channel: Data validity mask (255=valid, 0=no data/outside polygon)
        
        PNG output requires exactly one parameter (use parameter-name to select).
        Metadata is embedded in PNG tEXt chunks and returned in response headers.
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/coords'
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/trailConditions'
        - $ref: '#/components/parameters/f'
        - $ref: '#/components/parameters/width'
        - $ref: '#/components/parameters/height'
        - $ref: '#/components/parameters/depth'
      responses:
        '200':
          description: Data within the specified area
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
            image/png:
              schema:
                type: string
                format: binary
                description: |
                  PNG-encoded data for GPU shader consumption.
                  Use depth=8 for 8-bit grayscale+alpha (smaller) or depth=16 (default) for 16-bit precision.
                  Response headers include:
                  - X-EDR-Parameter: Parameter name
                  - X-EDR-Units: Unit symbol
                  - X-EDR-Min: Minimum value for decoding
                  - X-EDR-Max: Maximum value for decoding
                  - X-EDR-Encoding: Encoding type (uint8 or uint16)
                  - X-EDR-BBox: Bounding box (west,south,east,north)
                  - X-EDR-Width: Image width in pixels
                  - X-EDR-Height: Image height in pixels
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/radius:
    get:
      operationId: getRadius
      summary: Radius query
      description: Sample data within a radius of a point
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/coords'
        - name: within
          in: query
          required: true
          style: form
          explode: false
          description: Radius distance
          schema:
            type: number
        - name: within-units
          in: query
          required: false
          style: form
          explode: false
          description: Units for radius (m, km, mi)
          schema:
            type: string
            default: m
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/trailConditions'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Data within the specified radius
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/trajectory:
    get:
      operationId: getTrajectory
      summary: Trajectory query
      description: Sample data along a path with time coordinates
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/coords'
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Data along the trajectory
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/corridor:
    get:
      operationId: getCorridor
      summary: Corridor query
      description: Sample data within a buffered path
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/coords'
        - name: corridor-width
          in: query
          required: true
          style: form
          explode: false
          description: Width of the corridor
          schema:
            type: number
        - name: width-units
          in: query
          required: false
          style: form
          explode: false
          description: Units for corridor width
          schema:
            type: string
            default: m
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Data within the corridor
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/cube:
    get:
      operationId: getCube
      summary: Cube query
      description: Sample data within a bounding box with vertical and temporal extent
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - name: bbox
          in: query
          required: true
          style: form
          explode: false
          description: Bounding box (minx,miny,maxx,maxy)
          schema:
            type: array
            minItems: 4
            maxItems: 6
            items:
              type: number
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/crs'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Data within the cube
          content:
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Collection not found

  /collections/{collectionId}/items:
    get:
      operationId: getItems
      summary: Feature items (trails, storm events)
      description: |
        GeoJSON feature collections. Supported for feature-type collections:
        `trails` (OSM trail/track/bridleway centerlines) and the storm-event collections.
        
        ### `trails`
        
        One GeoJSON `LineString` feature per OSM way. Use `bbox` for the map-viewport
        query, or `q` to find a trail by name (`q` takes precedence over `bbox`).
        
        Add **`conditions=latest`** to merge each trail's most current physics-based
        condition into `properties.conditions` (see `TrailConditions`). Features with no
        condition data simply have no `conditions` key -- there is never a
        `"conditions": null`.
        
        For a forecast time series for one trail (e.g. "firm until 10am"), use
        `/collections/{collectionId}/items/{featureId}/conditions`.
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - name: bbox
          in: query
          required: false
          description: |
            `minLon,minLat,maxLon,maxLat` (WGS84). Omitted = the whole world (capped by `limit`).
          schema:
            type: string
            example: '-105.42,39.93,-105.36,39.98'
        - name: q
          in: query
          required: false
          description: Case-insensitive name search (trails only). Takes precedence over `bbox`.
          schema:
            type: string
            example: apex
        - name: class
          in: query
          required: false
          description: Filter by `feature_class` (trails only).
          schema:
            type: string
            enum: [mtb_trail, hiking_trail, track, bridleway]
        - name: limit
          in: query
          required: false
          description: Maximum features returned (clamped to 1-5000 for trails).
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/trailConditions'
        - name: datetime
          in: query
          required: false
          description: Storm-event collections only; ignored for trails.
          schema:
            type: string
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/TrailFeatureCollection'
        '400':
          description: Invalid request parameters, or the collection does not support /items
        '404':
          description: Collection not found

  /collections/{collectionId}/items/{featureId}/conditions:
    get:
      operationId: getTrailConditionsTimeseries
      summary: Forecast conditions time series for one trail
      description: |
        The best-available hourly series for one trail, in ascending `valid_time` order --
        the data behind a per-trail forecast chart. Covers from a few hours ago (recent
        past, for context) through the end of the forecast horizon.
        
        **One point per hour, each from the newest model run that has a value for that hour**
        (so the series is stitched across runs, and each point carries its own `run_time`).
        The horizon is therefore stable -- it does not shrink and grow depending on which run
        happens to have just finished ingesting. Read the horizon from the response (it is
        the last `valid_time`), do not assume a fixed number of hours.
        
        To find "now" in the series, use `valid_time`; `forecast_hour` is relative to each
        point's own `run_time`.
        
        - **404** if `featureId` is not a known trail.
        - **200 with an empty `conditions` array** for a known trail with no condition data
          (e.g. outside the coverage region). This is normal, not an error.
        
        Only the `trails` collection supports this operation.
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - name: featureId
          in: path
          required: true
          description: OSM way id (the `feature_id` / GeoJSON `id` of a trail feature).
          schema:
            type: integer
            format: int64
            example: 956937928
      responses:
        '200':
          description: Condition time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrailConditionsTimeseries'
        '400':
          description: Collection is not a linear-features collection
        '404':
          description: Collection or trail not found

  /collections/{collectionId}/instances:
    get:
      operationId: getInstances
      summary: List instances
      description: Returns available instances (model runs) for a collection
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          description: List of instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances'
        '404':
          description: Collection not found

  /collections/{collectionId}/instances/{instanceId}:
    get:
      operationId: getInstance
      summary: Get instance metadata
      description: Returns metadata about a specific instance
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/instanceId'
      responses:
        '200':
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '404':
          description: Instance not found

  /locations:
    get:
      operationId: getGlobalLocations
      summary: List all locations
      description: |
        Returns all known locations from database (airports with observations)
        and static configuration. Can filter by collection availability.
        
        Locations include airports with METAR/TAF data and pre-configured
        locations for gridded data queries.
      parameters:
        - name: collections
          in: query
          required: false
          description: Filter to locations with data in these collections (comma-separated)
          schema:
            type: string
          example: metar,taf
      responses:
        '200':
          description: GeoJSON FeatureCollection of locations
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'

  /locations/{locationId}:
    get:
      operationId: getGlobalLocationData
      summary: Get location data
      description: |
        Returns location metadata and available collections.
        
        If `collections` parameter is provided, fetches latest data from those collections.
        Without the parameter, returns only location info and list of available collections.
      parameters:
        - name: locationId
          in: path
          required: true
          description: Location identifier (e.g., ICAO code like KDEN, KJFK)
          schema:
            type: string
        - name: collections
          in: query
          required: false
          description: Collections to fetch data from (comma-separated)
          schema:
            type: string
          example: metar,taf,gfs-surface
      responses:
        '200':
          description: Location with data from requested collections
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '404':
          description: Location not found

  /collections/{collectionId}/locations:
    get:
      operationId: getCollectionLocations
      summary: List locations for collection
      description: |
        Returns all locations with data available in this collection.
        
        For observation collections (metar, taf), returns stations with recent data.
        For gridded collections, returns configured named locations.
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          description: GeoJSON FeatureCollection of locations
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
        '404':
          description: Collection not found

  /collections/{collectionId}/locations/{locationId}:
    get:
      operationId: getCollectionLocationData
      summary: Query data at location
      description: |
        Returns data from the collection at the specified location.
        
        For observation collections, returns the latest observation(s) at the station.
        For gridded collections, extracts data at the location's coordinates.
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - name: locationId
          in: path
          required: true
          description: Location identifier (e.g., ICAO code)
          schema:
            type: string
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/parameter-name'
        - $ref: '#/components/parameters/z'
        - $ref: '#/components/parameters/f'
        - name: limit
          in: query
          required: false
          description: Maximum number of observations to return (observation collections only)
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Data at the location
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSON'
            application/prs.coverage+json:
              schema:
                $ref: '#/components/schemas/CoverageJSON'
        '400':
          description: Invalid request parameters
        '404':
          description: Location or collection not found

components:
  parameters:
    collectionId:
      name: collectionId
      in: path
      required: true
      description: Collection identifier
      schema:
        type: string

    instanceId:
      name: instanceId
      in: path
      required: true
      description: Instance identifier
      schema:
        type: string

    coords:
      name: coords
      in: query
      required: true
      style: form
      explode: false
      description: |
        Well-Known Text (WKT) geometry:
        - Position: POINT(lon lat)
        - Area: POLYGON((lon1 lat1, lon2 lat2, ...))
        - Trajectory: LINESTRING(lon1 lat1, lon2 lat2, ...)
      schema:
        type: string

    z:
      name: z
      in: query
      required: false
      style: form
      explode: false
      description: |
        Vertical level(s). Supports:
        - Single value: 850
        - List: 1000,850,500
        - Range: 1000/500
        - Recurring: R5/1000/100
      schema:
        type: string

    datetime:
      name: datetime
      in: query
      required: false
      style: form
      explode: false
      description: |
        Temporal extent. Supports:
        - Single instant: 2024-01-01T00:00:00Z
        - Interval: 2024-01-01T00:00:00Z/2024-01-02T00:00:00Z
        - Open-ended: ../2024-01-01T00:00:00Z or 2024-01-01T00:00:00Z/..
      schema:
        type: string

    parameter-name:
      name: parameter-name
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated list of parameter names to return
      schema:
        type: string

    crs:
      name: crs
      in: query
      required: false
      style: form
      explode: false
      description: Coordinate reference system (default CRS84)
      schema:
        type: string
        default: http://www.opengis.net/def/crs/OGC/1.3/CRS84

    f:
      name: f
      in: query
      required: false
      style: form
      explode: false
      description: |
        Response format. For area queries, PNG format returns 16-bit encoded 
        data optimized for GPU shader consumption (requires single parameter).
      schema:
        type: string
        enum: [CoverageJSON, GeoJSON, json, png]
        default: CoverageJSON

    resolution-x:
      name: resolution-x
      in: query
      required: false
      style: form
      explode: false
      description: Horizontal resolution for area queries
      schema:
        type: number

    resolution-y:
      name: resolution-y
      in: query
      required: false
      style: form
      explode: false
      description: Vertical resolution for area queries
      schema:
        type: number

    width:
      name: width
      in: query
      required: false
      style: form
      explode: false
      description: |
        Requested output width in pixels (PNG only, max 4096).
        If specified, height must also be specified.
        Uses nearest-neighbor resampling from native grid resolution.
      schema:
        type: integer
        minimum: 1
        maximum: 4096

    height:
      name: height
      in: query
      required: false
      style: form
      explode: false
      description: |
        Requested output height in pixels (PNG only, max 4096).
        If specified, width must also be specified.
        Uses nearest-neighbor resampling from native grid resolution.
      schema:
        type: integer
        minimum: 1
        maximum: 4096

    depth:
      name: depth
      in: query
      required: false
      style: form
      explode: false
      description: |
        PNG encoding bit depth (PNG output only).
        - 16 (default): 16-bit precision using RG channels (65536 distinct values).
          Best for scientific applications requiring exact values.
        - 8: 8-bit grayscale+alpha (256 distinct values, ~50% smaller files).
          Best for visualization where exact precision is not critical.
      schema:
        type: integer
        enum: [8, 16]
        default: 16

    trailConditions:
      name: conditions
      in: query
      required: false
      description: |
        Linear-feature (`trails`) collections only. `latest` merges each feature's most
        current condition into `properties.conditions`. Any other value is ignored (the
        response is geometry-only), not an error.
      schema:
        type: string
        enum: [latest]

  schemas:
    LandingPage:
      type: object
      required:
        - title
        - links
      properties:
        title:
          type: string
        description:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Link:
      type: object
      required:
        - href
        - rel
      properties:
        href:
          type: string
          format: uri
        rel:
          type: string
        type:
          type: string
        title:
          type: string

    Conformance:
      type: object
      required:
        - conformsTo
      properties:
        conformsTo:
          type: array
          items:
            type: string
            format: uri

    Collections:
      type: object
      required:
        - links
        - collections
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'

    Collection:
      type: object
      required:
        - id
        - links
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        extent:
          $ref: '#/components/schemas/Extent'
        data_queries:
          type: object
        parameter_names:
          type: object
        output_formats:
          type: array
          items:
            type: string
        crs:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Extent:
      type: object
      properties:
        spatial:
          type: object
          properties:
            bbox:
              type: array
              items:
                type: array
                items:
                  type: number
            crs:
              type: string
        temporal:
          type: object
          properties:
            interval:
              type: array
              items:
                type: array
                items:
                  type: string
                  format: date-time
            trs:
              type: string
        vertical:
          type: object
          properties:
            interval:
              type: array
              items:
                type: array
                items:
                  type: number
            vrs:
              type: string

    Instances:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Instance:
      type: object
      required:
        - id
        - links
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        extent:
          $ref: '#/components/schemas/Extent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    CoverageJSON:
      type: object
      description: CoverageJSON document
      properties:
        type:
          type: string
          enum: [Coverage, CoverageCollection]
        domain:
          type: object
        parameters:
          type: object
        ranges:
          type: object

    GeoJSON:
      type: object
      description: GeoJSON FeatureCollection
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object

    TrailConditions:
      type: object
      description: |
        Physics-based soil-moisture advisory for one trail segment at one valid time.
        
        **This is an advisory physical signal, not a rideability verdict or closure
        authority.** The downscaling physics is validated against ground-truth soil moisture
        at independent research sites; it has not yet been validated against rider-reported
        trail conditions.
        
        Present only where the model has produced a value; absent (never `null`) otherwise.
      required: [run_time, valid_time, forecast_hour, model_version]
      properties:
        run_time:
          type: string
          format: date-time
          description: Model initialization time (HRRR run) this value derives from.
        valid_time:
          type: string
          format: date-time
          description: |
            The hour this value describes. With `conditions=latest` this is the most recent
            hour at or before "now" for which a value exists (never a future forecast hour).
        forecast_hour:
          type: integer
          description: Hours from `run_time` to `valid_time` (0 = analysis).
        soil_moisture:
          type: number
          nullable: true
          description: |
            Volumetric soil moisture, m3/m3 (4 cm depth), mean over the segment's vertices.
            Topographically downscaled from HRRR's 3 km value where `confidence` > 0.
            Hard to interpret without the soil's porosity -- prefer `saturation` for display.
        saturation:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Degree of saturation: `soil_moisture / theta_s`, the fraction of the soil's pore
            space holding water (0 = dry, 1 = saturated), mean over the segment's vertices.
            Unitless and directly color-rampable. `null` where there is no terrain/soil data
            (outside coverage) -- no porosity is guessed.
        frozen_fraction:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Fraction of the segment's vertices where HRRR soil temperature is at or below
            273.15 K. A fraction, not a boolean, so a partly frozen segment stays
            representable.
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Fraction of the segment's vertices that received real terrain-informed
            downscaling. **1.0** = fully downscaled; **0.0** = raw, undownscaled 3 km HRRR
            everywhere (outside coverage); in between = the segment straddles the coverage
            edge. `null` = no valid model reading at all. This is a data-coverage measure,
            not a statistical error bar.
        model_version:
          type: string
          description: |
            Version of the physics that produced the value (e.g. `trail-physics-v1`). A new
            version means the methodology changed; do not compare values across versions.
          example: trail-physics-v1

    TrailFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: integer
          format: int64
          description: OSM way id (same as `properties.feature_id`).
        geometry:
          type: object
          description: GeoJSON LineString, CRS:84 (lon, lat).
        properties:
          type: object
          properties:
            feature_id:
              type: integer
              format: int64
            feature_class:
              type: string
              enum: [mtb_trail, hiking_trail, track, bridleway]
            name:
              type: string
              nullable: true
            system:
              type: string
              nullable: true
              description: Trail-system grouping from OSM tags. Frequently null.
            region:
              type: string
            active:
              type: boolean
            updated_at:
              type: string
              format: date-time
            tags:
              type: object
              description: Raw OSM tags (e.g. `surface`, `mtb:scale`); not normalized.
              additionalProperties: true
            conditions:
              $ref: '#/components/schemas/TrailConditions'

    TrailFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/TrailFeature'
        numberReturned:
          type: integer
        timeStamp:
          type: string
          format: date-time

    TrailConditionsTimeseriesPoint:
      type: object
      description: One hour of a trail's forecast series. Same field semantics as `TrailConditions`.
      required: [valid_time, forecast_hour, run_time, model_version]
      properties:
        valid_time:
          type: string
          format: date-time
        forecast_hour:
          type: integer
          description: Hours from this point's own `run_time` to its `valid_time`.
        run_time:
          type: string
          format: date-time
          description: The model run THIS point comes from (newest run with a value for this hour).
        soil_moisture:
          type: number
          nullable: true
        saturation:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        frozen_fraction:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        model_version:
          type: string

    TrailConditionsTimeseries:
      type: object
      required: [feature_id, conditions]
      properties:
        feature_id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        run_time:
          type: string
          format: date-time
          nullable: true
          description: |
            The NEWEST model run contributing to the series (the series is stitched across
            runs; each point has its own `run_time`). `null` when `conditions` is empty.
        model_version:
          type: string
          nullable: true
          description: Version of the newest contributing run; each point carries its own.
        conditions:
          type: array
          description: Ascending by `valid_time`; empty when the trail has no condition data.
          items:
            $ref: '#/components/schemas/TrailConditionsTimeseriesPoint'
