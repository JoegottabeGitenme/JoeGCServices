# =============================================================================
# Weather WMS - Production Overrides
# =============================================================================
# This file overrides the base docker-compose.yml for production deployment.
# It removes exposed ports, adds security, and optimizes for production.
#
# The gateway (/opt/gateway) handles nginx, Cloudflare tunnel, and routing.
# This stack only runs the weather services and infrastructure.
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/production/docker-compose.prod.yml up -d
# =============================================================================

services:
  # ==========================================================================
  # INFRASTRUCTURE OVERRIDES (remove exposed ports)
  # ==========================================================================
  postgres:
    ports: []
    # Stock settings (128 MB shared_buffers, 1 GB max_wal_size) under ~10 GB/h of WAL forced a
    # checkpoint every ~2.7 minutes (427 requested vs 182 timed in 27 h), each followed by a wave
    # of full-page images (21% of WAL records), and every query read through a 128 MB cache:
    # slow statements everywhere, a 10-connection ingester pool running dry, storm-event upserts
    # at 60-150 ms a row. Sized for this host (31 GB RAM, NVMe, ~200 GB free disk).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - max_wal_size=16GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=64MB
      - -c
      - wal_compression=on
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    # Parallel queries allocate dynamic shared memory in /dev/shm (Docker's default is 64 MB).
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 6G

  redis:
    ports: []
    # Redis is a pure L2 tile cache. It MUST evict rather than grow into the
    # container memory limit - an unbounded Redis was OOM-killed (exit 137),
    # which took wms-api down with it and silently stopped data retention.
    #   maxmemory 768mb  : below the 1G limit, leaving headroom for overhead
    #   allkeys-lru      : evict least-recently-used tiles when full
    #   --save ''        : no RDB snapshots (cache contents are disposable and
    #                      persistence was growing the volume for no benefit)
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save ''
    deploy:
      resources:
        limits:
          memory: 1G

  minio:
    ports: []
    networks:
      - default
      - shared-services
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN:-folkweather.com}/minio/
    deploy:
      resources:
        limits:
          memory: 2G

  # ==========================================================================
  # APPLICATION SERVICES
  # Services that the gateway needs to reach are on shared-services network.
  # ==========================================================================
  wms-api:
    ports: []
    networks:
      - default
      - shared-services
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weatherwms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weatherwms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-weather-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOW_HTTP: "true"
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-16}
      ENABLE_L1_CACHE: ${ENABLE_L1_CACHE:-true}
      TILE_CACHE_SIZE_MB: ${TILE_CACHE_SIZE_MB:-8192}
      TILE_CACHE_TTL_SECS: ${TILE_CACHE_TTL_SECS:-600}
      ENABLE_PREFETCH: ${ENABLE_PREFETCH:-true}
      PREFETCH_RINGS: ${PREFETCH_RINGS:-2}
      PREFETCH_MIN_ZOOM: ${PREFETCH_MIN_ZOOM:-3}
      PREFETCH_MAX_ZOOM: ${PREFETCH_MAX_ZOOM:-12}
      ENABLE_CACHE_WARMING: ${ENABLE_CACHE_WARMING:-true}
      CACHE_WARMING_MAX_ZOOM: ${CACHE_WARMING_MAX_ZOOM:-4}
      CACHE_WARMING_HOURS: ${CACHE_WARMING_HOURS:-0}
      CACHE_WARMING_LAYERS: ${CACHE_WARMING_LAYERS:-gfs_TMP:temperature}
      CACHE_WARMING_CONCURRENCY: ${CACHE_WARMING_CONCURRENCY:-8}
      ENABLE_MEMORY_PRESSURE: ${ENABLE_MEMORY_PRESSURE:-true}
      MEMORY_LIMIT_MB: ${MEMORY_LIMIT_MB:-28000}
      MEMORY_PRESSURE_THRESHOLD: ${MEMORY_PRESSURE_THRESHOLD:-0.80}
      MEMORY_PRESSURE_TARGET: ${MEMORY_PRESSURE_TARGET:-0.70}
      INGESTER_URL: http://ingester:8082
    deploy:
      resources:
        limits:
          memory: 16G

  edr-api:
    ports: []
    networks:
      - default
      - shared-services
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weatherwms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weatherwms}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-weather-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      EDR_BASE_URL: https://${DOMAIN:-folkweather.com}/edr
      EDR_CHUNK_CACHE_MB: ${CHUNK_CACHE_SIZE_MB:-8192}
      EDR_LISTEN_ADDR: "0.0.0.0:8083"
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    deploy:
      resources:
        limits:
          memory: 8G

  web-dashboard:
    ports: []
    networks:
      - default
      - shared-services
    deploy:
      resources:
        limits:
          memory: 256M

  ingester:
    ports: []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-weatherwms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weatherwms}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-weather-data}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOW_HTTP: "true"
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
      CONFIG_DIR: /app/config
    volumes:
      - ./data/static:/data/static:ro
    deploy:
      resources:
        limits:
          # Bumped from 4G during the trail-conditions session: the weekly
          # OSM/Overpass sync (crates/trail-sync) parses large tiled JSON
          # responses concurrently with normal GRIB/NetCDF ingestion, and
          # RSS climbed to the 4G limit and triggered a restart even after
          # tiling bounded any single fetch's peak allocation (likely
          # allocator retention across many tile iterations, not a true
          # leak -- see the tiling fix commit). Host has 31G total, ~22G
          # available, so 8G leaves ample headroom for everything else.
          #
          # Raised 8G -> 12G after the kernel log showed the ingester being
          # OOM-killed ~2x/hour (docker's OOMKilled flag stays false for
          # these, so `docker inspect` hides it; use `dmesg | grep -i
          # "killed process"`). A single full-disk GOES band-2 ingest alone
          # reached the 8G cap (21696x21696 grid = 1.9 GB per f32 copy), and
          # two overlapping ones are fatal. crates/ingestion/src/netcdf.rs now
          # runs at most one such file at a time and holds fewer copies, but
          # 12G keeps headroom for it alongside the CONUS bands, GRIB ingests
          # and the Overpass sync. Host: 31G total, ~23G available.
          memory: 12G

  downloader:
    ports: []
    networks:
      - default
      - shared-services
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
      INGESTER_URL: http://ingester:8082/ingest
      STATUS_PORT: 8081
      CONFIG_DIR: /app/config
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 2G

  # ==========================================================================
  # MONITORING (remove exposed ports)
  # ==========================================================================
  prometheus:
    ports: []
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-30}d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    ports: []
    networks:
      - default
      - shared-services
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-folkweather.com}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M

  promtail:
    deploy:
      resources:
        limits:
          memory: 256M

  autoheal:
    deploy:
      resources:
        limits:
          memory: 128M

  # ==========================================================================
  # REMOVED SERVICES
  # ==========================================================================
  pgadmin:
    deploy:
      replicas: 1

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  shared-services:
    external: true
