server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers from our project
      - source_labels: ['__meta_docker_container_name']
        regex: '/(weather-wms[-_])?(.*)'
        target_label: 'container'
        replacement: '$2'
      
      # Extract service name from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'service'
        replacement: '$1'
      
      # Add compose service label if available
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      
      # Add compose project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'

    pipeline_stages:
      # Parse JSON logs from Rust services using tracing-subscriber
      # Format: {"timestamp":"...","level":"INFO","fields":{"message":"...","key":"val"},"target":"crate::module","span":{"name":"..."}}
      - json:
          expressions:
            level: level
            target: target
            timestamp: timestamp
            fields: fields
            span: span

      # Extract nested fields from 'fields' object
      - json:
          source: fields
          expressions:
            message: message
            layer: layer
            style: style
            model: model
            parameter: parameter
            error: error
            storage_path: storage_path
            zarr_path: zarr_path
            bbox: bbox
            # Quote single-letter keys to avoid YAML 1.1 boolean interpretation
            # (y/n are interpreted as yes/no -> true/false in YAML 1.1)
            "x": "x"
            "y": "y"
            "z": "z"
            chunk_x: chunk_x
            chunk_y: chunk_y
            read_ms: read_ms
            render_ms: render_ms

      # Extract span name if present
      - json:
          source: span
          expressions:
            span_name: name

      # Fallback regex for non-JSON logs (e.g., from postgres, redis)
      - match:
          selector: '{compose_service=~".+"} |~ "^[^{]"'
          stages:
            - regex:
                expression: '^(?P<timestamp>\S+)\s+(?P<level>\w+)\s+(?P<target>\S+):\s+(?P<message>.*)$'
      
      # Normalize log levels to lowercase
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      
      # Add labels for efficient querying in Grafana
      - labels:
          level:
          target:
          layer:
          model:
          parameter:
      
      # Set timestamp from log if available
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - '2006-01-02T15:04:05.999999999Z07:00'
      
      # Format output to include key context fields
      - template:
          source: output_line
          template: '{{ if .message }}{{ .message }}{{ if .error }} | error={{ .error }}{{ end }}{{ if .layer }} | layer={{ .layer }}{{ end }}{{ if .model }} | model={{ .model }}{{ end }}{{ if .storage_path }} | path={{ .storage_path }}{{ end }}{{ else }}{{ .__line__ }}{{ end }}'
      
      - output:
          source: output_line
