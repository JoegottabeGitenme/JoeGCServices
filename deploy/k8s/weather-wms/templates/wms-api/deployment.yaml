apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather-wms.fullname" . }}-wms-api
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: wms-api
spec:
  replicas: {{ .Values.wmsApi.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "weather-wms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wms-api
  template:
    metadata:
      labels:
        {{- include "weather-wms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wms-api
    spec:
      containers:
        - name: wms-api
          image: {{ include "weather-wms.image" (dict "registry" .Values.global.image.registry "repository" .Values.wmsApi.image.repository "tag" .Values.wmsApi.image.tag) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONFIG_DIR
              value: "/app/config"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: DATABASE_POOL_SIZE
              value: "50"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: S3_SECRET_KEY
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ALLOW_HTTP
              value: "true"
            # Ingester proxy — points to the co-located data pipeline pod
            - name: INGESTER_URL
              value: "http://{{ include "weather-wms.fullname" . }}-data-pipeline-ingester:8082"
            {{- if .Values.wmsApi.cleanup.separate }}
            # When cleanup runs in a separate pod, disable on main replicas
            - name: ENABLE_CLEANUP
              value: "false"
            - name: ENABLE_SYNC
              value: "false"
            {{- end }}
            {{- range $key, $value := .Values.wmsApi.env }}
            {{- if and (eq $key "ENABLE_CLEANUP") $.Values.wmsApi.cleanup.separate }}
            {{- /* Skip — already set above */ -}}
            {{- else if and (eq $key "ENABLE_SYNC") $.Values.wmsApi.cleanup.separate }}
            {{- /* Skip — already set above */ -}}
            {{- else }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config-models
              mountPath: /app/config/models
              readOnly: true
            - name: config-layers
              mountPath: /app/config/layers
              readOnly: true
            - name: config-styles
              mountPath: /app/config/styles
              readOnly: true
          resources:
            {{- toYaml .Values.wmsApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /wms?SERVICE=WMS&REQUEST=GetCapabilities
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /wms?SERVICE=WMS&REQUEST=GetCapabilities
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config-models
          configMap:
            name: {{ include "weather-wms.fullname" . }}-models
        - name: config-layers
          configMap:
            name: {{ include "weather-wms.fullname" . }}-layers
        - name: config-styles
          configMap:
            name: {{ include "weather-wms.fullname" . }}-styles
