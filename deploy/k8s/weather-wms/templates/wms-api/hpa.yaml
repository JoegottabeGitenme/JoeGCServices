{{- if .Values.wmsApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "weather-wms.fullname" . }}-wms-api
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: wms-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "weather-wms.fullname" . }}-wms-api
  minReplicas: {{ .Values.wmsApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.wmsApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.wmsApi.autoscaling.targetCPUUtilization }}
{{- end }}
