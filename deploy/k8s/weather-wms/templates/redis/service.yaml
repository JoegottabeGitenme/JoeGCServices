apiVersion: v1
kind: Service
metadata:
  name: {{ include "weather-wms.fullname" . }}-redis
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "weather-wms.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
