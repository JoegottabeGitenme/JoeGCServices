apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "weather-wms.fullname" . }}-minio-setup
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-setup
  annotations:
    # Run after install and upgrade
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "weather-wms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-setup
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "weather-wms.fullname" . }}-secrets
                  key: S3_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO to be ready..."
              until mc alias set minio {{ include "weather-wms.s3Endpoint" . }} $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done
              mc mb --ignore-existing minio/{{ .Values.minio.bucket }}
              mc anonymous set download minio/{{ .Values.minio.bucket }}
              echo "Bucket {{ .Values.minio.bucket }} created and configured"
