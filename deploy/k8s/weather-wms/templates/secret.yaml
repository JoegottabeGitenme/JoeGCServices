apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weather-wms.fullname" . }}-secrets
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database | quote }}
  DATABASE_URL: {{ include "weather-wms.databaseUrl" . | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  REDIS_URL: {{ include "weather-wms.redisUrl" . | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3.secretKey | quote }}
  S3_ENDPOINT: {{ include "weather-wms.s3Endpoint" . | quote }}
  {{- if .Values.secrets.earthdata.username }}
  EARTHDATA_USERNAME: {{ .Values.secrets.earthdata.username | quote }}
  {{- end }}
  {{- if .Values.secrets.earthdata.password }}
  EARTHDATA_PASSWORD: {{ .Values.secrets.earthdata.password | quote }}
  {{- end }}
  {{- if .Values.secrets.earthdata.token }}
  EARTHDATA_TOKEN: {{ .Values.secrets.earthdata.token | quote }}
  {{- end }}
