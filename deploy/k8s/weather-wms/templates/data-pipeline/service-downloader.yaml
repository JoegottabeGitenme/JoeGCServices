apiVersion: v1
kind: Service
metadata:
  name: {{ include "weather-wms.fullname" . }}-data-pipeline-downloader
  labels:
    {{- include "weather-wms.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-pipeline
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http-dl
      name: http
  selector:
    {{- include "weather-wms.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data-pipeline
