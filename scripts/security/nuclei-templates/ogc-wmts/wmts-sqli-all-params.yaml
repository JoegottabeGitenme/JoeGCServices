id: ogc-wmts-sqli-all-params

info:
  name: OGC WMTS SQL Injection - All Parameters
  author: weather-wms-security
  severity: critical
  description: |
    Tests all WMTS parameters for SQL injection vulnerabilities including:
    - LAYER, STYLE (layer/style selection)
    - TILEMATRIXSET, TILEMATRIX, TILEROW, TILECOL (tile addressing)
    - FORMAT (output format)
    - TIME, RUN, FORECAST, ELEVATION (weather dimensions)
    - I, J, INFOFORMAT (GetFeatureInfo)
  reference:
    - https://owasp.org/www-community/attacks/SQL_Injection
    - https://www.ogc.org/standards/wmts
  tags: sqli,wmts,ogc,injection,critical

variables:
  base_layer: "gfs_TMP"
  base_tms: "WebMercatorQuad"

http:
  # Test LAYER parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{payload}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "{{base_layer}}'"
        - "{{base_layer}}' OR '1'='1"
        - "{{base_layer}}' OR '1'='1'--"
        - "{{base_layer}}'; SELECT 1--"
        - "{{base_layer}}\" OR \"1\"=\"1"
        - "1 UNION SELECT NULL,NULL,NULL--"
        - "{{base_layer}}' AND 1=CONVERT(int,@@version)--"

    attack: batteringram
    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "mysql_fetch"
          - "ORA-"
          - "PostgreSQL"
          - "sqlite"
          - "syntax error"
          - "unterminated string"
          - "database error"
        condition: or

      - type: regex
        regex:
          - "(?i)(sql|database|query).*error"

  # Test STYLE parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE={{payload}}&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "default'"
        - "default' OR '1'='1"
        - "' OR '1'='1'--"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test TILEMATRIXSET parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{payload}}&TILEMATRIX=0&TILEROW=0&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "{{base_tms}}'"
        - "{{base_tms}}' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test TILEMATRIX parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX={{payload}}&TILEROW=0&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "0'"
        - "0' OR '1'='1"
        - "'; SELECT 1--"
        - "0 UNION SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test TILEROW parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW={{payload}}&TILECOL=0&FORMAT=image/png"

    payloads:
      payload:
        - "0'"
        - "0' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "syntax error"
        condition: or

  # Test TILECOL parameter
  - method: GET
    path:
      - "{{BaseURL}}/wmts?SERVICE=WMTS&REQUEST=GetTile&LAYER={{base_layer}}&STYLE=default&TILEMATRIXSET={{base_tms}}&TILEMATRIX=0&TILEROW=0&TILECOL={{payload}}&FORMAT=image/png"

    payloads:
      payload:
        - "0'"
        - "0' OR '1'='1"
        - "'; SELECT 1--"

    attack: batteringram
    stop-at-first-match: true

    matchers:
      - type: word
