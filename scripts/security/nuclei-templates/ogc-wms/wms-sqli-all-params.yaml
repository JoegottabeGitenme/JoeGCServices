      - "{{BaseURL}}/wms?SERVICE=WMS&REQUEST=GetFeatureInfo&LAYERS={{base_layer}}&QUERY_LAYERS={{base_layer}}&CRS={{base_crs}}&BBOX={{base_bbox}}&WIDTH=256&HEIGHT=256&I=128&J=128&INFO_FORMAT={{payload}}"

    payloads:
