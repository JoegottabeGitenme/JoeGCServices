# GFS - Global Forecast System Configuration
# NCEP Global Forecast System, 0.25° resolution
#
# Pressure levels available for ingestion:
# Lower troposphere: 1000, 975, 950, 925, 900, 850 mb
# Mid troposphere: 800, 750, 700, 650, 600, 550, 500, 450, 400, 350 mb
# Upper troposphere: 300, 250, 200, 150 mb
# Stratosphere: 100, 70, 50, 30, 20, 10 mb

model:
  id: gfs
  name: "GFS - Global Forecast System"
  description: "NCEP Global Forecast System, 0.25° resolution"
  enabled: true

# WMS/WMTS dimension configuration
# Defines which dimensions are exposed in capabilities and accepted in requests
dimensions:
  type: forecast # "forecast" = RUN+FORECAST dimensions, "observation" = TIME dimension
  run: true # RUN dimension - model initialization time (ISO8601)
  forecast: true # FORECAST dimension - hours ahead from run time
  elevation: true # ELEVATION dimension - vertical levels (from parameter definitions)

source:
  type: aws_s3
  bucket: noaa-gfs-bdp-pds
  prefix_template: "gfs.{date}/{cycle:02}/atmos"
  file_pattern: "gfs.t{cycle:02}z.pgrb2.0p25.f{forecast:03}"
  region: us-east-1
  # Enable selective download via .idx files to reduce bandwidth
  # Downloads only configured parameters instead of entire GRIB file (~90% savings)
  use_index_file: true

grid:
  projection: geographic
  resolution: "0.25deg"
  bbox:
    min_lon: -180.0
    min_lat: -90.0
    max_lon: 180.0
    max_lat: 90.0
  # Note: GRIB data comes as 0-360, but ingestion converts to -180/180 for storage

schedule:
  cycles: [0, 6, 12, 18] # All 4 daily cycles
  # Full 16-day horizon at native cadence (verified against AWS bucket):
  # hourly through f120, then 3-hourly through f384
  forecast_hours:
    ranges:
      - { start: 0, end: 120, step: 1 } # hourly (5 days)
      - { start: 123, end: 384, step: 3 } # 3-hourly (days 5-16)
  poll_interval_secs: 3600 # Check for new data every hour
  delay_hours: 4 # Data typically available 4 hours after cycle time
  max_concurrent: 3 # Allow up to 3 concurrent downloads

retention:
  hours: 48 # Keep 48 hours of data (covers 2+ model runs)
  keep_latest_runs: 2 # Always keep at least 2 complete runs

# Precaching configuration - disabled for now
precaching:
  enabled: false
  keep_recent_cycles: 1 # Only most recent model cycle
  forecast_hours: [0, 3, 6, 9, 12] # Key forecast hours
  warm_on_ingest: false
  poll_interval_secs: 300
  parameters: ["TMP", "UGRD", "VGRD"] # Most requested parameters

# GRIB2 level type codes reference (Table 4.5):
#   1 = surface
#   100 = isobaric (pressure level in Pa, displayed as mb)
#   101 = mean sea level
#   103 = height above ground (in m)
#   200 = entire atmosphere
#   214 = low cloud layer (212=bottom, 213=top)
#   224 = middle cloud layer (222=bottom, 223=top)
#   234 = high cloud layer (232=bottom, 233=top)

parameters:
  # ==========================================================================
  # Temperature Parameters
  # ==========================================================================

  # Surface Temperature (2m)
  - name: TMP
    description: "Temperature"
    grib2:
      discipline: 0
      category: 0
      number: 0
    downsample: mean
    levels:
      - type: height_above_ground
        level_code: 103
        value: 2
        display: "2 m above ground"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [150, 350] # ~-123°C to 77°C (covers all Earth temps including stratosphere)

  # Temperature at pressure levels
  - name: TMP
    description: "Temperature"
    grib2:
      discipline: 0
      category: 0
      number: 0
    downsample: mean
    levels:
      - type: isobaric
        level_code: 100
        values:
          [
            1000,
            975,
            950,
            925,
            900,
            850,
            700,
            500,
            300,
            250,
            200,
            100,
            70,
            50,
            30,
            20,
            10,
          ]
        display_template: "{value} mb"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [150, 350] # ~-123°C to 77°C

  # Dew Point Temperature (2m)
  - name: DPT
    description: "Dew Point Temperature"
    grib2:
      discipline: 0
      category: 0
      number: 6
    downsample: mean
    levels:
      - type: height_above_ground
        level_code: 103
        value: 2
        display: "2 m above ground"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [150, 330] # ~-123°C to 57°C (dew point typically lower than temp)

  # ==========================================================================
  # Wind Parameters
  # ==========================================================================

  # U-component wind at 10m and pressure levels
  - name: UGRD
    description: "U-Component of Wind"
    grib2:
      discipline: 0
      category: 2
      number: 2
    downsample: mean
    levels:
      - type: height_above_ground
        level_code: 103
        value: 10
        display: "10 m above ground"
      - type: isobaric
        level_code: 100
        values: [1000, 975, 950, 925, 900, 850, 700, 500, 300, 250, 200, 100]
        display_template: "{value} mb"
    units: m/s
    valid_range: [-200, 200] # Wind components can be negative (directional)

  # V-component wind at 10m and pressure levels
  - name: VGRD
    description: "V-Component of Wind"
    grib2:
      discipline: 0
      category: 2
      number: 3
    downsample: mean
    levels:
      - type: height_above_ground
        level_code: 103
        value: 10
        display: "10 m above ground"
      - type: isobaric
        level_code: 100
        values: [1000, 975, 950, 925, 900, 850, 700, 500, 300, 250, 200, 100]
        display_template: "{value} mb"
    units: m/s
    valid_range: [-200, 200] # Wind components can be negative (directional)

  # Surface wind gust
  - name: GUST
    description: "Wind Speed (Gust)"
    grib2:
      discipline: 0
      category: 2
      number: 22
    downsample: max
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: m/s
    valid_range: [0, 150] # Gusts are always positive (magnitude)

  # ==========================================================================
  # Pressure Parameters
  # ==========================================================================

  # Mean sea level pressure
  - name: PRMSL
    description: "Pressure Reduced to MSL"
    grib2:
      discipline: 0
      category: 3
      number: 1
    downsample: mean
    levels:
      - type: mean_sea_level
        level_code: 101
        display: "mean sea level"
    units: Pa
    display_units: hPa
    conversion: Pa_to_hPa
    valid_range: [85000, 110000] # 850-1100 hPa (extreme lows to highs)

  # Geopotential height
  - name: HGT
    description: "Geopotential Height"
    grib2:
      discipline: 0
      category: 3
      number: 5
    downsample: mean
    levels:
      - type: isobaric
        level_code: 100
        values:
          [1000, 925, 850, 700, 500, 300, 250, 200, 100, 70, 50, 30, 20, 10]
        display_template: "{value} mb"
    units: gpm
    valid_range: [-500, 35000] # From below sea level to stratosphere

  # ==========================================================================
  # Moisture Parameters
  # ==========================================================================

  # Relative humidity
  - name: RH
    description: "Relative Humidity"
    grib2:
      discipline: 0
      category: 1
      number: 1
    downsample: mean
    levels:
      - type: height_above_ground
        level_code: 103
        value: 2
        display: "2 m above ground"
      - type: isobaric
        level_code: 100
        values: [1000, 975, 950, 925, 900, 850, 700, 500, 300]
        display_template: "{value} mb"
    units: "%"
    valid_range: [0, 100] # Percentage 0-100%

  # Precipitable Water (entire atmosphere column)
  - name: PWAT
    description: "Precipitable Water"
    grib2:
      discipline: 0
      category: 1
      number: 3
    downsample: mean
    levels:
      - type: entire_atmosphere
        level_code: 200
        display: "entire atmosphere"
    units: kg/m^2
    display_units: mm
    valid_range: [0, 100] # 0-100 mm precipitable water

  # ==========================================================================
  # Precipitation Parameters
  # ==========================================================================

  # Total Precipitation (accumulated)
  - name: APCP
    description: "Total Precipitation"
    grib2:
      discipline: 0
      category: 1
      number: 8
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: kg/m^2
    display_units: mm
    accumulation: true
    valid_range: [0, 1000] # 0-1000 mm accumulated precip

  # Composite Reflectivity
  - name: REFC
    description: "Composite Reflectivity"
    grib2:
      discipline: 0
      category: 16
      number: 196
    downsample: max
    levels:
      - type: entire_atmosphere
        level_code: 200
        display: "entire atmosphere"
    units: dBZ
    valid_range: [-30, 80] # dBZ range for radar reflectivity

  # ==========================================================================
  # Convective/Stability Parameters
  # ==========================================================================

  # Convective Available Potential Energy
  - name: CAPE
    description: "Convective Available Potential Energy"
    grib2:
      discipline: 0
      category: 7
      number: 6
    downsample: max
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: J/kg
    valid_range: [0, 10000] # 0-10000 J/kg (extreme CAPE > 5000)

  # Convective Inhibition
  - name: CIN
    description: "Convective Inhibition"
    grib2:
      discipline: 0
      category: 7
      number: 7
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: J/kg
    valid_range: [-1000, 0] # CIN is typically negative (inhibition)

  # ==========================================================================
  # Cloud Parameters
  # ==========================================================================

  # Total Cloud Cover
  - name: TCDC
    description: "Total Cloud Cover"
    grib2:
      discipline: 0
      category: 6
      number: 1
    downsample: mean
    levels:
      - type: entire_atmosphere
        level_code: 200
        display: "entire atmosphere"
    units: "%"
    valid_range: [0, 100] # Percentage 0-100%

  # Low Cloud Cover
  - name: LCDC
    description: "Low Cloud Cover"
    grib2:
      discipline: 0
      category: 6
      number: 3
    downsample: mean
    levels:
      - type: cloud_layer
        level_code: 214
        display: "low cloud layer"
    units: "%"
    valid_range: [0, 100] # Percentage 0-100%

  # Middle Cloud Cover
  - name: MCDC
    description: "Middle Cloud Cover"
    grib2:
      discipline: 0
      category: 6
      number: 4
    downsample: mean
    levels:
      - type: cloud_layer
        level_code: 224
        display: "middle cloud layer"
    units: "%"
    valid_range: [0, 100] # Percentage 0-100%

  # High Cloud Cover
  - name: HCDC
    description: "High Cloud Cover"
    grib2:
      discipline: 0
      category: 6
      number: 5
    downsample: mean
    levels:
      - type: cloud_layer
        level_code: 234
        display: "high cloud layer"
    units: "%"
    valid_range: [0, 100] # Percentage 0-100%

  # ==========================================================================
  # Ocean/Ice Parameters (available in GFS atmospheric files over ocean)
  # ==========================================================================

  # Sea Surface Temperature (skin temperature - equals SST over ocean grid points)
  - name: TMP
    description: "Temperature"
    grib2:
      discipline: 0
      category: 0
      number: 0
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [220, 330]

  # Sea Ice Concentration
  - name: ICEC
    description: "Ice Concentration"
    grib2:
      discipline: 10
      category: 2
      number: 0
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: fraction
    valid_range: [0, 1]

  # Sea Ice Thickness
  - name: ICETK
    description: "Ice Thickness"
    grib2:
      discipline: 10
      category: 2
      number: 1
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: m
    valid_range: [0, 10]

  # Sea Ice Temperature
  - name: ICETMP
    description: "Ice Temperature"
    grib2:
      discipline: 10
      category: 2
      number: 8
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [200, 280]

  # ==========================================================================
  # Visibility
  # ==========================================================================

  # Visibility
  - name: VIS
    description: "Visibility"
    grib2:
      discipline: 0
      category: 19
      number: 0
    downsample: mean
    levels:
      - type: surface
        level_code: 1
        display: "surface"
    units: m
    display_units: km
    conversion: m_to_km
    valid_range: [0, 100000] # 0-100 km visibility

  # ==========================================================================
  # Soil (Noah land model layers, GRIB2 depth-below-land code 106)
  # ==========================================================================
  # Level values are GRIB2 scaled values (scale factor 2) = layer TOP in cm.
  # Catalog level strings: "0 cm below ground", "10 cm below ground", etc.
  # idx_level: exact .idx match strings (layer top-bottom in meters) —
  # verified from live gfs.tXXz.pgrb2.0p25.fYYY.idx files.

  # Soil Temperature
  - name: TSOIL
    description: "Soil Temperature"
    grib2:
      discipline: 2
      category: 0
      number: 2
    downsample: mean
    levels:
      - type: depth_below_surface
        level_code: 106
        value: 0
        idx_level: "0-0.1 m below ground"
        display_template: "{value} cm below ground"
      - type: depth_below_surface
        level_code: 106
        value: 10
        idx_level: "0.1-0.4 m below ground"
        display_template: "{value} cm below ground"
      - type: depth_below_surface
        level_code: 106
        value: 40
        idx_level: "0.4-1 m below ground"
        display_template: "{value} cm below ground"
      - type: depth_below_surface
        level_code: 106
        value: 100
        idx_level: "1-2 m below ground"
        display_template: "{value} cm below ground"
    units: K
    display_units: °C
    conversion: K_to_C
    valid_range: [200, 350]

# Composite layers (derived from multiple parameters)
composites:
  - name: WIND_BARBS
    description: "Wind barbs visualization"
    requires: [UGRD, VGRD]
    renderer: wind_barbs
