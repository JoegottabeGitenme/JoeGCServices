# MRMS - Multi-Radar Multi-Sensor Configuration
# High-resolution radar and precipitation analysis
#
# The ~2-minute products only (reflectivity, precipitation rate), 2 hours of history.
# The hourly QPE accumulations live in `mrms-qpe.yaml`: retention is per model and (for
# observation models) doubles as the downloader's lookback, so they could not share a
# model with a 72-hour window.

model:
  id: mrms
  name: "MRMS - Multi-Radar Multi-Sensor"
  description: "CONUS-wide radar mosaic and precipitation analysis at ~1km resolution"
  enabled: true

# WMS/WMTS dimension configuration
# Defines which dimensions are exposed in capabilities and accepted in requests
dimensions:
  type: observation # "observation" = TIME dimension (ISO8601 timestamps)
  time: true # TIME dimension - observation timestamp
  elevation: false # No vertical levels for radar data

source:
  type: aws_s3_grib2
  bucket: noaa-mrms-pds
  path_pattern: "CONUS/{product}/{date:yyyyMMdd}/MRMS_{product}.{timestamp}.grib2.gz"
  region: us-east-1
  compression: gzip

grid:
  projection: latlon
  resolution: "0.01deg" # ~1km
  bbox:
    min_lon: -130.0
    min_lat: 20.0
    max_lon: -60.0
    max_lat: 55.0
  dimensions:
    x: 7000
    y: 3500

schedule:
  type: observation # Observation data, not forecast
  poll_interval_secs: 120 # Check every 2 minutes (data updates ~2min)
  max_concurrent: 2 # Allow up to 2 concurrent downloads for this model
  # Note: lookback_minutes is deprecated for observation models.
  # The downloader now uses retention.hours to determine how far back to look for data.
  # This ensures historical data is downloaded up to the retention limit on startup.

retention:
  hours: 2 # Keep 2 hours of radar data for animation loops
  keep_latest_observations: 60 # ~2 hours of observations (updates every ~2 min)

# Precaching configuration - disabled for now (large memory footprint ~98MB/grid)
precaching:
  enabled: false
  keep_recent: 3
  warm_on_ingest: false
  poll_interval_secs: 120
  parameters: []

# GRIB2 level type codes reference:
#   102 = height above MSL (in m)
#
# The level description for a code is shared by every parameter in this file (first entry wins), so
# it is a template: REFL / PRECIP_RATE / PRECIP_FLAG are at 0 m ("0 m above MSL", unchanged) and MESH
# is labelled 500 m in the GRIB message ("500 m above MSL").

parameters:
  # Seamless Hybrid Scan Reflectivity - the fully composited radar mosaic
  # This is the product that shows continuous coverage like Windy/NWS
  # GRIB2 codes: discipline=209 (MRMS local), category=8, number=8
  - name: REFL
    description: "Seamless Hybrid Scan Reflectivity"
    downsample: max
    grib2:
      discipline: 209 # MRMS local table
      category: 8 # Reflectivity category in MRMS
      number: 8 # SeamlessHSR parameter number
    product: "SeamlessHSR_00.00"
    levels:
      - type: height_above_msl
        level_code: 102
        value: 0
        display_template: "{value} m above MSL"
    units: "dBZ"
    display_units: "dBZ"
    valid_range: [-30, 80]

  # Precipitation Rate
  # GRIB2 codes: discipline=209 (MRMS local), category=6, number=1
  - name: PRECIP_RATE
    description: "Precipitation Rate"
    downsample: max
    grib2:
      discipline: 209
      category: 6 # Precipitation category in MRMS
      number: 1 # PrecipRate parameter number
    product: "PrecipRate_00.00"
    levels:
      - type: height_above_msl
        level_code: 102
        value: 0
        display_template: "{value} m above MSL"
    units: "mm/hr"
    display_units: "mm/hr"
    valid_range: [0, 100]

  # Surface precipitation type (categorical codes). 2-minute cadence like REFL.
  # GRIB2 codes confirmed on a live message: discipline 209, category 6, number 0, level type 102
  # (0 m), PNG packing (template 41).
  #
  #   -3  no radar coverage (becomes null)      0  no precipitation
  #    1  warm stratiform rain                  3  snow
  #    6  convective rain                       7  hail
  #   10  cold stratiform rain (the rain/snow transition class)
  #   91  tropical / stratiform rain mix       96  tropical / convective rain mix
  #
  # The labels are MRMS's, and were checked against data rather than taken on trust, on 2026-10-09
  # 23:00Z and 2026-01-15 18:00Z (HRRR 1 h forecasts valid at the same instant; 400-600 sampled pixels
  # per code):
  #   -3  98.9% of these pixels are reflectivity's own no-coverage value (-999)
  #    0  not one pixel has reflectivity >= 30 dBZ
  #    3  January: mean 2 m temperature -8.0 C, 89% <= 0 C, HRRR says snow at 96% of its wet points
  #    1  January: +13.9 C, HRRR rain at 100%        6, 7  HRRR rain at 100%, +22..27 C
  #    7  median 46 dBZ, 83% >= 40 dBZ, 70% have MESH > 0 (<= 7% for any other code)
  #    6, 96  median 39-41 dBZ (convective)          1, 10  median 14-18 dBZ (stratiform)
  #   10  +1.6..+2.3 C, a mix of HRRR snow and rain points: the transition zone
  #   91, 96  Gulf coast, +22..24 C, HRRR rain at 100%
  # valid_range [0, 96] turns -3 into "no data" (null) and keeps 0 as a real "no precipitation".
  # Categorical: pyramid levels must NOT average these codes (DownsampleMethod::for_parameter) and point
  # reads must not interpolate between them (read_point_nearest).
  - name: PRECIP_FLAG
    description: "Precipitation Type (categorical)"
    downsample: nearest
    grib2:
      discipline: 209
      category: 6
      number: 0
    product: "PrecipFlag_00.00"
    levels:
      - type: height_above_msl
        level_code: 102
        value: 0
        display_template: "{value} m above MSL"
    units: "code"
    display_units: "code"
    valid_range: [0, 96]

  # Maximum Estimated Size of Hail (MESH), instantaneous, 2-minute cadence.
  # GRIB2 codes confirmed on a live message: discipline 209, category 3, number 28, level type 102 at
  # 500 m (MRMS labels this 2-D field 500 m above MSL), PNG packing (template 41).
  # Values are millimetres. Measured on the 2026-10-09 23:00 granule against reflectivity at the same
  # instant: -3 is outside radar coverage (99.9% of those pixels are reflectivity's no-coverage value,
  # ~33% of the grid); -1 is inside coverage with no hail (0.0% of those pixels are no-coverage, ~67%
  # of the grid); positive sizes sit under real storms (96% of them >= 30 dBZ, median 46 dBZ).
  # valid_range [-1, 200] therefore maps -3 to null and keeps -1: "covered, no hail" stays
  # distinguishable from "no data". Treat any value <= 0 as no hail.
  - name: MESH
    description: "Maximum Estimated Size of Hail"
    downsample: max
    grib2:
      discipline: 209
      category: 3
      number: 28
    product: "MESH_00.50"
    levels:
      - type: height_above_msl
        level_code: 102
        value: 500
        display_template: "{value} m above MSL"
    units: "mm"
    display_units: "mm"
    valid_range: [-1, 200]
