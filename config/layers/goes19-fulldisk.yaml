# GOES-19 Full Disk (GOES East) Layer Configuration
# Defines WMS/WMTS layers exposed for GOES-19 Full Disk satellite imagery
# Hemisphere coverage

model: goes19-fulldisk
display_name: "GOES-19 Full Disk - GOES East"

# GOES-19 (East) Full Disk sector coverage
default_bbox:
  west: -156.3
  south: -81.3
  east: 6.3
  north: 81.3

# GOES is observation data, not forecast
dimension_type: observation

layers:
  # ==========================================================================
  # Visible Band
  # ==========================================================================
  
  - id: goes19fd_CMI_C02
    parameter: CMI_C02
    title: "Red Visible (0.64um) - Full Disk"
    abstract: "GOES-19 ABI Band 2 Full Disk - Red visible for cloud/vegetation"
    style_file: goes_visible.json
    units:
      native: reflectance
      display: "%"
    levels:
      - value: "visible_red"
        default: true

  # ==========================================================================
  # Water Vapor Band
  # ==========================================================================
  
  - id: goes19fd_CMI_C08
    parameter: CMI_C08
    title: "Upper-Level Water Vapor (6.2um) - Full Disk"
    abstract: "GOES-19 ABI Band 8 Full Disk - Upper tropospheric water vapor"
    style_file: goes_ir.json
    units:
      native: K
      display: K
    levels:
      - value: "upper_vapor"
        default: true

  # ==========================================================================
  # Infrared Band
  # ==========================================================================
  
  - id: goes19fd_CMI_C13
    parameter: CMI_C13
    title: "Clean Longwave IR (10.3um) - Full Disk"
    abstract: "GOES-19 ABI Band 13 Full Disk - Clean window IR for cloud top temperature"
    style_file: goes_ir.json
    units:
      native: K
      display: K
    levels:
      - value: "clean_ir"
        default: true
