# AIGFS Layer Configuration
# Defines WMS/WMTS layers exposed for the AIGFS model
# Each layer maps to a parameter and defines available styles
#
# Pressure levels available for ELEVATION dimension (in mb):
# Surface/Near-surface: 2m above ground, 10m above ground
# Troposphere: 1000, 925, 850, 700, 600, 500, 400, 300, 250, 200, 150
# Stratosphere: 100, 50

model: aigfs
display_name: "AIGFS - AI Global Forecast System"

# Default bounding box for all layers (can be overridden per layer)
default_bbox:
  west: -180.0
  south: -90.0
  east: 180.0
  north: 90.0

layers:
  # ==========================================================================
  # Temperature Layers
  # ==========================================================================
  
  - id: aigfs_TMP
    parameter: TMP
    title: "Temperature"
    abstract: "Air temperature at various levels"
    style_file: temperature.json
    units:
      native: K
      display: "°C"
      conversion: K_to_C
    levels:
      - value: "2 m above ground"
        default: true
      # Troposphere
      - value: "1000 mb"
      - value: "925 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "500 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      # Stratosphere
      - value: "100 mb"
      - value: "50 mb"

  # ==========================================================================
  # Wind Layers
  # ==========================================================================
  
  - id: aigfs_UGRD
    parameter: UGRD
    title: "U-Component of Wind"
    abstract: "Eastward wind component"
    style_file: wind.json
    units:
      native: m/s
      display: m/s
    levels:
      - value: "10 m above ground"
        default: true
      # Troposphere
      - value: "1000 mb"
      - value: "925 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "500 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      # Stratosphere
      - value: "100 mb"
      - value: "50 mb"

  - id: aigfs_VGRD
    parameter: VGRD
    title: "V-Component of Wind"
    abstract: "Northward wind component"
    style_file: wind.json
    units:
      native: m/s
      display: m/s
    levels:
      - value: "10 m above ground"
        default: true
      # Troposphere
      - value: "1000 mb"
      - value: "925 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "500 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      # Stratosphere
      - value: "100 mb"
      - value: "50 mb"

  - id: aigfs_WIND_BARBS
    parameter: WIND_BARBS
    title: "Wind Barbs"
    abstract: "Wind direction and speed barbs (composite of UGRD/VGRD)"
    style_file: wind_barbs.json
    composite: true
    requires: [UGRD, VGRD]
    levels:
      - value: "10 m above ground"
        default: true
      - value: "1000 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "500 mb"
      - value: "300 mb"
      - value: "200 mb"
      - value: "100 mb"

  # ==========================================================================
  # Pressure Layers
  # ==========================================================================
  
  - id: aigfs_PRMSL
    parameter: PRMSL
    title: "Mean Sea Level Pressure"
    abstract: "Atmospheric pressure reduced to mean sea level"
    style_file: mslp.json
    units:
      native: Pa
      display: hPa
      conversion: Pa_to_hPa
    levels:
      - value: "mean sea level"
        default: true

  - id: aigfs_HGT
    parameter: HGT
    title: "Geopotential Height"
    abstract: "Height of pressure surfaces"
    style_file: geopotential.json
    units:
      native: gpm
      display: m
    levels:
      - value: "500 mb"
        default: true
      - value: "1000 mb"
      - value: "925 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      - value: "100 mb"
      - value: "50 mb"

  # ==========================================================================
  # Moisture Layers
  # ==========================================================================
  
  - id: aigfs_SPFH
    parameter: SPFH
    title: "Specific Humidity"
    abstract: "Mass of water vapor per unit mass of air"
    style_file: humidity.json
    units:
      native: kg/kg
      display: g/kg
    levels:
      - value: "850 mb"
        default: true
      - value: "1000 mb"
      - value: "925 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "500 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      - value: "100 mb"
      - value: "50 mb"

  # ==========================================================================
  # Vertical Motion
  # ==========================================================================
  
  - id: aigfs_VVEL
    parameter: VVEL
    title: "Vertical Velocity"
    abstract: "Vertical air motion (omega, positive = downward)"
    style_file: vvel.json
    units:
      native: Pa/s
      display: Pa/s
    levels:
      - value: "500 mb"
        default: true
      - value: "1000 mb"
      - value: "925 mb"
      - value: "850 mb"
      - value: "700 mb"
      - value: "600 mb"
      - value: "400 mb"
      - value: "300 mb"
      - value: "250 mb"
      - value: "200 mb"
      - value: "150 mb"
      - value: "100 mb"
      - value: "50 mb"
