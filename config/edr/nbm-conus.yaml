# NBM CONUS EDR Configuration
# Defines collections organized by vertical level for the OGC EDR API
#
# NBM provides a comprehensive blend of model output including:
# - Surface weather (precipitation, fire indices, convective parameters)
# - Near-surface parameters (temp, humidity at 2m; wind at 10m)
# - Cloud and atmospheric parameters (ceiling, total cloud cover)
#
# Collections are organized by vertical level (OGC EDR requires consistent vertical extent):
# - surface: Parameters at the surface level
# - 2m-agl: Temperature/humidity at 2m above ground
# - 10m-agl: Wind parameters at 10m above ground
# - cloud: Cloud-related parameters (ceiling, cloud cover)
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

model: nbm-conus

collections:
  # ==========================================================================
  # Surface Level Parameters
  # ==========================================================================
  - id: nbm-conus-surface
    title: "NBM CONUS - Surface"
    description: "Surface-level parameters including precipitation, visibility, fire weather, and convective indices"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      # Precipitation
      - name: APCP01
        levels: [surface]
        valid_range: { min: 0, max: 200 }  # mm
      - name: APCP06
        levels: [surface]
        valid_range: { min: 0, max: 500 }  # mm
      - name: POP01
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
      - name: POP06
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
      - name: POP12
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
      # Visibility
      - name: VIS
        levels: [surface]
        valid_range: { min: 0, max: 50000 }  # meters
      # Winter weather
      - name: ASNOW06
        levels: [surface]
        valid_range: { min: 0, max: 2 }  # meters
      - name: FZRA06
        levels: [surface]
        valid_range: { min: 0, max: 0.5 }  # meters
      - name: PSNOW06
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
      - name: PFZRA06
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
      - name: SNOLEV
        levels: [surface]
        valid_range: { min: 0, max: 5000 }  # meters
      # Fire weather
      - name: FOSINDX
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # index
      - name: HAINES
        levels: [surface]
        valid_range: { min: 2, max: 6 }  # index (2-6 scale)
      # Convective
      - name: CAPE
        levels: [surface]
        valid_range: { min: 0, max: 10000 }  # J/kg
      - name: CIN
        levels: [surface]
        valid_range: { min: -2000, max: 0 }  # J/kg
      - name: LI
        levels: [surface]
        valid_range: { min: -15, max: 15 }  # K
      - name: PTSTM12
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # percent
    run_mode: instances

  # ==========================================================================
  # 2m Above Ground Level - Temperature and Humidity
  # ==========================================================================
  - id: nbm-conus-2m-agl
    title: "NBM CONUS - 2m Above Ground"
    description: "Temperature and humidity parameters at 2m above ground level"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
        valid_range: { min: 180, max: 340 }  # Kelvin
      - name: DPT
        levels: [2]
        valid_range: { min: 180, max: 320 }  # Kelvin
      - name: TMAX
        levels: [2]
        valid_range: { min: 180, max: 350 }  # Kelvin
      - name: TMIN
        levels: [2]
        valid_range: { min: 180, max: 340 }  # Kelvin
      - name: APTMP
        levels: [2]
        valid_range: { min: 180, max: 350 }  # Kelvin (apparent temp)
      - name: RH
        levels: [2]
        valid_range: { min: 0, max: 100 }  # percent
      - name: MAXRH
        levels: [2]
        valid_range: { min: 0, max: 100 }  # percent
      - name: MINRH
        levels: [2]
        valid_range: { min: 0, max: 100 }  # percent
    run_mode: instances

  # ==========================================================================
  # 10m Above Ground Level - Wind Parameters
  # ==========================================================================
  - id: nbm-conus-10m-agl
    title: "NBM CONUS - 10m Above Ground"
    description: "Wind parameters at 10m above ground level"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: WIND
        levels: [10]
        valid_range: { min: 0, max: 100 }  # m/s
      - name: UGRD
        levels: [10]
        valid_range: { min: -100, max: 100 }  # m/s
      - name: VGRD
        levels: [10]
        valid_range: { min: -100, max: 100 }  # m/s
      - name: WDIR
        levels: [10]
        valid_range: { min: 0, max: 360 }  # degrees
      - name: GUST
        levels: [10]
        valid_range: { min: 0, max: 150 }  # m/s
    run_mode: instances

  # ==========================================================================
  # Cloud and Atmospheric Parameters
  # ==========================================================================
  - id: nbm-conus-cloud
    title: "NBM CONUS - Cloud"
    description: "Cloud parameters including ceiling, cloud base height, and total cloud cover"
    level_filter:
      # Mixed levels - ceiling is cloud base, TCDC is entire atmosphere
      level_type: mixed
    parameters:
      - name: CEIL
        levels: [cloud_base]
        valid_range: { min: 0, max: 20000 }  # meters
      - name: HCB
        levels: [cloud_base]
        valid_range: { min: 0, max: 20000 }  # meters
      - name: TCDC
        levels: [entire_atmosphere]
        valid_range: { min: 0, max: 100 }  # percent
      - name: LLWS
        levels: [0-2000_ft]
        valid_range: { min: 0, max: 50 }  # knots
    run_mode: instances

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"
  cache_policy:
    png_max_age: 3600 # 1 hour - NBM updates hourly

limits:
  max_parameters_per_request: 20
  max_time_steps: 350
  max_vertical_levels: 10
  max_response_size_mb: 50
  max_area_sq_degrees: 100
  max_area_sq_degrees_png: 2500
