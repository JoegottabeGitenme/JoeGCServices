# NBM CONUS EDR Configuration
# Defines collections organized by vertical level for the OGC EDR API
#
# NBM provides a comprehensive blend of model output including:
# - Surface weather (precipitation, fire indices, convective parameters)
# - Near-surface parameters (temp, humidity at 2m; wind at 10m/30m/80m)
# - Cloud and atmospheric parameters (ceiling, total cloud cover)
#
# Collections are organized by vertical level type (consistent with GFS/HRRR):
# - surface: Parameters at the surface level
# - height-agl: Parameters at heights above ground level
# - cloud: Cloud-related parameters (ceiling, cloud cover)

model: nbm-conus

collections:
  # ==========================================================================
  # Surface Level Parameters
  # ==========================================================================
  - id: nbm-conus-surface
    title: "NBM CONUS - Surface"
    description: "Surface-level parameters including precipitation, visibility, fire weather, and convective indices"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      # Precipitation
      - name: APCP01
        levels: [surface]
      - name: APCP06
        levels: [surface]
      - name: POP01
        levels: [surface]
      - name: POP06
        levels: [surface]
      - name: POP12
        levels: [surface]
      # Visibility
      - name: VIS
        levels: [surface]
      # Winter weather
      - name: ASNOW06
        levels: [surface]
      - name: FZRA06
        levels: [surface]
      - name: PSNOW06
        levels: [surface]
      - name: PFZRA06
        levels: [surface]
      - name: SNOLEV
        levels: [surface]
      # Fire weather
      - name: FOSINDX
        levels: [surface]
      - name: HAINES
        levels: [surface]
      # Convective
      - name: CAPE
        levels: [surface]
      - name: CIN
        levels: [surface]
      - name: LI
        levels: [surface]
      - name: PTSTM12
        levels: [surface]
    run_mode: instances

  # ==========================================================================
  # Heights Above Ground Level
  # ==========================================================================
  - id: nbm-conus-height-agl
    title: "NBM CONUS - Heights Above Ground"
    description: "Parameters at heights above ground level (2m temp/humidity, 10m/30m/80m wind)"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      # 2m temperature and humidity
      - name: TMP
        levels: [2]
      - name: DPT
        levels: [2]
      - name: TMAX
        levels: [2]
      - name: TMIN
        levels: [2]
      - name: APTMP
        levels: [2]
      - name: RH
        levels: [2]
      - name: MAXRH
        levels: [2]
      - name: MINRH
        levels: [2]
      # 10m wind
      - name: WIND
        levels: [10]
      - name: UGRD
        levels: [10]
      - name: VGRD
        levels: [10]
      - name: WDIR
        levels: [10]
      - name: GUST
        levels: [10]
      # Higher level winds
      - name: WIND
        levels: [30]
      - name: WIND
        levels: [80]
    run_mode: instances

  # ==========================================================================
  # Cloud and Atmospheric Parameters
  # ==========================================================================
  - id: nbm-conus-cloud
    title: "NBM CONUS - Cloud"
    description: "Cloud parameters including ceiling, cloud base height, and total cloud cover"
    level_filter:
      # Mixed levels - ceiling is cloud base, TCDC is entire atmosphere
      level_type: mixed
    parameters:
      - name: CEIL
        levels: [cloud_base]
      - name: HCB
        levels: [cloud_base]
      - name: TCDC
        levels: [entire_atmosphere]
      - name: LLWS
        levels: [0-2000_ft]
    run_mode: instances

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 3600 # 1 hour - NBM updates hourly

limits:
  max_parameters_per_request: 15
  max_time_steps: 48
  max_vertical_levels: 10
  max_response_size_mb: 50
  max_area_sq_degrees: 100
  max_area_sq_degrees_png: 2500
