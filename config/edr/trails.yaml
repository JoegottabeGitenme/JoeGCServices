# Trails EDR Configuration
#
# OSM-sourced trail/track/bridleway centerlines, synced weekly via
# crates/trail-sync (see docs/trail-conditions-design.md) and stored in the
# PostGIS `linear_features` table, served as a GeoJSON feature collection.
#
# This is feature-collection data with LINESTRING geometry: one feature per
# OSM way (not merged per trail system), so that a rider can see one part of
# a trail as rideable and another as not once the physics/condition layers
# land in a later phase.
#
# Session 13: `?conditions=latest` (radius/area/items) merges each feature's
# latest `segment_conditions` row (soil_moisture, frozen_fraction,
# confidence, valid_time, forecast_hour, model_version) into its GeoJSON
# properties, when the trail-physics service has produced one -- see
# crates/storage/src/segment_conditions.rs and services/trail-physics/.
#
# Session 14: fixed "latest" to mean the most recent hour we actually have a
# value for (valid_time nearest now, never a future forecast row) instead of
# "whichever row was written to the database most recently" -- the two only
# differ during backlog/reprocessing windows, but differed badly during
# trail-physics' first production run. Also added a per-trail forecast
# timeseries endpoint (below) for UIs that want more than a single current
# reading -- e.g. "firm until 10am" style charts.
#
# **Coverage caveat, stated plainly**: as of this session, trail-physics'
# terrain-informed downscaling only has real coverage for the WS1 static
# stack's Boulder-area pilot region (pipelines/static/README.md) -- outside
# that area, a segment either has no `conditions` block at all (trail-physics
# hasn't reached it, e.g. it isn't an active mtb/hiking/track/bridleway
# segment) or a `conditions` block with `confidence: 0.0` (a real HRRR
# reading was sampled, but with no terrain downscaling applied -- see
# `confidence`'s own description below). For areas without a `conditions`
# block, the app should query the gridded HRRR collections (hrrr-soil,
# hrrr-snow) along the trail's own geometry directly, same as before this
# session.
#
# Supported EDR queries:
# - /collections/trails/radius - Trail features near a point
# - /collections/trails/area   - Trail features intersecting a bounding box
# - /collections/trails/items  - GeoJSON items (bbox viewport query, or
#                                 ?q=<name> for name search, e.g. ?q=apex)
# All three accept `&conditions=latest` to merge in trail-physics' single
# most-current reading, plus `limit` and `class=<feature_class>`, and all three
# return `numberReturned` (== limit means truncated). Session 14 fixed /area and
# /radius, which silently dropped `limit`/`class` and returned no numberReturned.
#
# - /collections/trails/items/{feature_id}/conditions - the best-available
#   hourly series for one trail: from a few hours ago through the end of the
#   forecast horizon, ONE point per hour taken from the newest model run
#   that has it (so it's stitched across runs; each point carries its own
#   run_time). Plain JSON (not GeoJSON -- no geometry). A stable horizon, not
#   "whatever the latest run happens to cover". 404 if feature_id isn't a
#   known trail; a known trail with no coverage yet returns 200 with an
#   empty `conditions` array, not an error.
#
# Trailheads (point locations, not linear features) are served separately
# through the shared `locations` collection with `location_type=trailhead`
# -- see /edr/locations?q=apex.
#
# Advisory disclaimer: `soil_moisture`/`frozen_fraction` are a physics-based
# advisory signal, not a rideability judgment or a closure authority --
# validated against real ground-truth data at two independent research
# sites (see validation/tarrawarra/README.md, validation/shalehills/README.md
# and web/science.html) but not yet checked against rider-reported trail
# conditions (design doc's "Rung 2", not yet run).

model: trails
data_type: featurecollection
observation_source: linear_features

collections:
  - id: trails
    title: "Trails, Tracks & Bridleways (OSM)"
    description: "OSM-sourced trail centerlines (mountain bike trails, hiking trails, tracks, bridleways). One feature per OSM way. Geometry + OSM tags always; add ?conditions=latest for the latest physics-based soil moisture/frozen-ground advisory where trail-physics has produced one (currently the Boulder-area WS1 pilot region only -- see comment above)."
    parameters:
      - name: feature_class # mtb_trail | hiking_trail | track | bridleway
        levels: [surface]
      - name: name
        levels: [surface]
      - name: soil_moisture # fractional volumetric (m3/m3); only present with ?conditions=latest
        levels: [surface]
      - name: saturation # 0-1 degree of saturation = soil_moisture / theta_s (fraction of the soil's pore space holding water), terrain-downscaled; null outside static-stack coverage (no theta_s there); only present with ?conditions=latest
        levels: [surface]
      - name: frozen_fraction # 0-1, fraction of sampled vertices with TSOIL<=273.15K; only present with ?conditions=latest
        levels: [surface]
      - name: confidence # 0-1, fraction of sampled vertices with real WS1 terrain downscaling (vs. raw HRRR fallback); only present with ?conditions=latest
        levels: [surface]
    # Where `conditions` data exists, surfaced on the collection response as
    # `conditions_coverage` so a client can grey out the conditions UI for
    # trails outside it without fetching them. **Must be kept in step with the
    # trail-physics static stack** (TRAIL_PHYSICS_STATIC_STACK_PATH): this is
    # the WGS84 envelope of that stack's grid -- compute it with
    # `StaticStack.wgs84_bbox()` (or pipelines/static/grid_spec.py's
    # region_grid_spec(...) corners -> EPSG:4326). It is the SAME rectangle
    # trail-physics uses to choose which trails to process, and is wider than
    # the requested region bbox because a lon/lat box becomes a rotated
    # rectangle in the stack's Albers CRS (the corners are nodata -- hence the
    # per-feature `confidence` is the authoritative signal, not this box).
    conditions_coverage:
      bbox: [-106.249, 38.4993, -104.3485, 40.848]
      description: "Front Range foothills (Fort Collins to Colorado Springs). A coarse rectangle: its corners may lack terrain data. Per-trail `confidence` and the presence of a `conditions` block are authoritative. Outside it, trails have geometry only."
    run_mode: latest

settings:
  output_formats:
    - application/geo+json
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 3600

limits:
  max_parameters_per_request: 6
  max_time_steps: 1
  max_vertical_levels: 1
  max_response_size_mb: 50
  max_radius_km: 50
  max_area_sq_degrees: 25
