# GOES GLM Lightning EDR Configuration
#
# Lightning flashes detected by the Geostationary Lightning Mapper (GLM) on
# GOES-East (GOES-19) and GOES-West (GOES-18), clipped to CONUS, stored in PostGIS
# and served as a GeoJSON feature collection of Points. See
# crates/storage/src/lightning.rs and services/ingester/src/lightning.rs.
#
# This is a LIVE feed, not an archive: flashes are kept for 24 hours
# (LIGHTNING_RETENTION_HOURS on the ingester). Granules land every 20 s per
# satellite, ~14 s after their observation window closes, so the data is roughly
# a minute behind the lightning itself at best.
#
# Supported EDR queries:
# - /collections/glm-lightning/items   - flashes in a bbox (?bbox=) or all of CONUS
# - /collections/glm-lightning/area    - flashes in a bbox (?coords=minLon,minLat,maxLon,maxLat)
# - /collections/glm-lightning/radius  - flashes within a radius of a point
#
# Parameters (all three):
#   window=PT10M          server-relative time window (ISO-8601 duration; default PT10M, max PT24H)
#   datetime=start/end    explicit RFC-3339 interval, `..` for an open end (instead of window)
#   after=<lastId>        only flashes newer than a previous response's `lastId` (efficient polling)
#   satellite=            goes-east (default) | goes-west | both
#   limit=                default 1000, max 10000; numberReturned == limit means truncated
#
# `satellite` defaults to goes-east, NOT both: East and West both see most of CONUS,
# so `both` returns the same flash twice (once per satellite) in the overlap. There is
# no cross-satellite de-duplication.
#
# A quiet sky is normal: an empty `features` array is a valid answer, not an error.
# But an empty answer is ambiguous on its own (quiet sky, or a dead feed?), so every
# response carries `dataThrough` / `dataAgeSeconds`: the end of the newest granule
# processed. Empty + recent = quiet sky; empty + old or null = do NOT say "no lightning".
# Server-side, pipeline health is the same signal exported as
# glm_latest_granule_end_timestamp_seconds (not flash recency, which is legitimately
# old on a clear day) -- see deploy/prometheus/alerts.yml.
#
# Advisory: GLM detects optical emissions from cloud tops, not ground strikes, and its
# detection efficiency varies with the flash and the view angle. Treat counts as
# relative activity, not an exact tally.

model: glm-lightning
data_type: featurecollection
observation_source: lightning

collections:
  - id: glm-lightning
    title: "Lightning Flashes (GOES GLM)"
    description: "Near-real-time lightning flashes from the GOES-East and GOES-West Geostationary Lightning Mapper, CONUS, last 24 hours. One Point per flash with its time, optical energy and quality flag. Roughly a minute behind real time."
    parameters:
      - name: flash_time      # RFC 3339, ms precision
        levels: [surface]
      - name: energy_j        # radiant energy, joules (~1e-15 to 1e-12); null if missing
        levels: [surface]
      - name: quality         # 0 = good; 1, 3, 5 = degraded
        levels: [surface]
    run_mode: latest

settings:
  output_formats:
    - application/geo+json
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 5

limits:
  max_parameters_per_request: 3
  max_time_steps: 1
  max_vertical_levels: 1
  max_response_size_mb: 50
  max_radius_km: 500
  max_area_sq_degrees: 2000
