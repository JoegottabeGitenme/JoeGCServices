# NBM Puerto Rico EDR Configuration

model: nbm-puertorico

collections:
  - id: nbm-puertorico-surface
    title: "NBM Puerto Rico - Surface Weather"
    description: "Surface temperature, humidity, and basic weather parameters"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
      - name: DPT
        levels: [2]
      - name: TMAX
        levels: [2]
      - name: TMIN
        levels: [2]
      - name: RH
        levels: [2]
    run_mode: instances

  - id: nbm-puertorico-precipitation
    title: "NBM Puerto Rico - Precipitation"
    description: "Tropical precipitation amount and probability forecasts"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: APCP01
        levels: [surface]
      - name: APCP06
        levels: [surface]
      - name: POP06
        levels: [surface]
    run_mode: instances

  - id: nbm-puertorico-wind
    title: "NBM Puerto Rico - Wind"
    description: "Wind speed, direction, and gusts (important for hurricane season)"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: WIND
        levels: [10]
      - name: UGRD
        levels: [10]
      - name: VGRD
        levels: [10]
      - name: WDIR
        levels: [10]
      - name: GUST
        levels: [10]
    run_mode: instances

  - id: nbm-puertorico-aviation
    title: "NBM Puerto Rico - Aviation"
    description: "Aviation weather parameters"
    level_filter:
      level_type: mixed
    parameters:
      - name: VIS
        levels: [surface]
      - name: CEIL
        levels: [cloud_base]
      - name: TCDC
        levels: [entire_atmosphere]
    run_mode: instances

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 3600

limits:
  max_parameters_per_request: 10
  max_time_steps: 48
  max_vertical_levels: 10
  max_response_size_mb: 50
  max_area_sq_degrees: 25
  max_area_sq_degrees_png: 100
