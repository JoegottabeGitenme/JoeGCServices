# AIGEFS EDR Configuration
# AI GFS Ensemble System (Ensemble Mean) - 0.25° resolution global coverage
#
# Coverage: Global (-180 to 180 lon, -90 to 90 lat)
# Resolution: 0.25° (~27km at equator)
# Update frequency: Every 6 hours (00z, 06z, 12z, 18z)
# Forecast range: 16 days (384 hours) at 6-hour intervals
# Ensemble: 31 members - this config is for ensemble mean (avg) products
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

model: aigefs

collections:
  # ===========================================================================
  # Instance-based collections (access all available model runs)
  # ===========================================================================
  
  # Upper-air data on pressure levels
  - id: aigefs-isobaric
    title: "AIGEFS - Isobaric Levels (Ensemble Mean)"
    description: "Upper-air parameters on pressure levels (1000-50 hPa) - ensemble mean"
    level_filter:
      level_type: isobaric
      level_code: 100
    parameters:
      - name: TMP
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: 150, max: 350 }  # Kelvin
      - name: HGT
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -500, max: 35000 }  # geopotential meters
      - name: UGRD
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -200, max: 200 }  # m/s
      - name: VGRD
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -200, max: 200 }  # m/s
      - name: SPFH
        levels: [1000, 925, 850, 700, 500, 300]
        valid_range: { min: 0, max: 0.05 }  # kg/kg
      - name: VVEL
        levels: [1000, 925, 850, 700, 500, 300, 200, 100]
        valid_range: { min: -10, max: 10 }  # Pa/s
    run_mode: instances

  # Parameters at specific heights above ground level
  - id: aigefs-height-agl
    title: "AIGEFS - Heights Above Ground (Ensemble Mean)"
    description: "Parameters at specific heights above ground level (2m temp, 10m wind) - ensemble mean"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
        valid_range: { min: 150, max: 350 }  # Kelvin
      - name: UGRD
        levels: [10]
        valid_range: { min: -200, max: 200 }  # m/s
      - name: VGRD
        levels: [10]
        valid_range: { min: -200, max: 200 }  # m/s
    run_mode: instances

  # Mean sea level pressure
  - id: aigefs-msl
    title: "AIGEFS - Mean Sea Level (Ensemble Mean)"
    description: "Mean sea level pressure - ensemble mean"
    level_filter:
      level_type: mean_sea_level
      level_code: 101
    parameters:
      - name: PRMSL
        levels: [mean_sea_level]
        valid_range: { min: 85000, max: 110000 }  # Pa
    run_mode: instances

  # Surface precipitation
  - id: aigefs-surface
    title: "AIGEFS - Surface (Ensemble Mean)"
    description: "Surface parameters including precipitation - ensemble mean"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: APCP
        levels: [surface]
        valid_range: { min: 0, max: 500 }  # kg/m^2 (= mm)
    run_mode: instances

  # ===========================================================================
  # Latest-only collections (quick access to most recent model run)
  # These use the non-instance endpoints for simpler access patterns:
  #   GET /edr/collections/aigefs-height-agl-latest/position?coords=POINT(-100 40)
  # ===========================================================================
  
  - id: aigefs-isobaric-latest
    title: "AIGEFS - Isobaric Levels (Latest, Ensemble Mean)"
    description: "Most recent upper-air data on pressure levels - ensemble mean"
    level_filter:
      level_type: isobaric
      level_code: 100
    parameters:
      - name: TMP
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: 150, max: 350 }
      - name: HGT
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -500, max: 35000 }
      - name: UGRD
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -200, max: 200 }
      - name: VGRD
        levels: [1000, 925, 850, 700, 500, 300, 200, 100, 50]
        valid_range: { min: -200, max: 200 }
      - name: SPFH
        levels: [1000, 925, 850, 700, 500, 300]
        valid_range: { min: 0, max: 0.05 }
      - name: VVEL
        levels: [1000, 925, 850, 700, 500, 300, 200, 100]
        valid_range: { min: -10, max: 10 }
    run_mode: latest

  - id: aigefs-height-agl-latest
    title: "AIGEFS - Heights Above Ground (Latest, Ensemble Mean)"
    description: "Most recent data at specific heights above ground - ensemble mean"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
        valid_range: { min: 150, max: 350 }
      - name: UGRD
        levels: [10]
        valid_range: { min: -200, max: 200 }
      - name: VGRD
        levels: [10]
        valid_range: { min: -200, max: 200 }
    run_mode: latest

  - id: aigefs-msl-latest
    title: "AIGEFS - Mean Sea Level (Latest, Ensemble Mean)"
    description: "Most recent mean sea level pressure - ensemble mean"
    level_filter:
      level_type: mean_sea_level
      level_code: 101
    parameters:
      - name: PRMSL
        levels: [mean_sea_level]
        valid_range: { min: 85000, max: 110000 }
    run_mode: latest

  - id: aigefs-surface-latest
    title: "AIGEFS - Surface (Latest, Ensemble Mean)"
    description: "Most recent surface parameters - ensemble mean"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: APCP
        levels: [surface]
        valid_range: { min: 0, max: 500 }
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png  # 16-bit encoded PNG for GPU shaders (area queries only)
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"

# Response size limits
# AIGEFS is 0.25° resolution (~27km), similar to GFS
limits:
  max_parameters_per_request: 10
  max_time_steps: 65              # 384 hours at 6h intervals = 65 time steps
  max_vertical_levels: 15         # Accommodates all 13 isobaric levels
  max_response_size_mb: 100       # Higher than HRRR due to lower resolution
  max_area_sq_degrees: 500        # ~2000km x 1000km regional area
  max_area_sq_degrees_png: 10000  # PNG queries - global or large regional coverage
  max_radius_km: 750              # Larger radius acceptable at this resolution
