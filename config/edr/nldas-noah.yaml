# NLDAS-2 Noah Land Surface Model - EDR Configuration
# Observation data from NASA GES DISC
#
# Key differences from NWP models:
# - No forecast hours (observation data)
# - Depth layers for soil variables (depth_below_surface)
# - Instances represent observation timestamps, not model runs
# - Updates hourly with ~4 day latency
#
# Coverage: CONUS + Southern Canada (-125 to -67 lon, 25 to 53 lat)
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

model: nldas-noah
data_type: observation

collections:
  # ===========================================================================
  # Soil Moisture (depth layers)
  # ===========================================================================

  - id: nldas-soil-moisture
    title: "NLDAS-2 Noah - Soil Moisture"
    description: "Soil moisture at 4 depth layers plus root zone (0.125° hourly)"
    level_filter:
      level_type: depth_below_surface
    parameters:
      - name: SoilM_0_10cm
        levels: ["0-10 cm depth"]
        valid_range: { min: 0, max: 50 }
      - name: SoilM_10_40cm
        levels: ["10-40 cm depth"]
        valid_range: { min: 0, max: 150 }
      - name: SoilM_40_100cm
        levels: ["40-100 cm depth"]
        valid_range: { min: 0, max: 250 }
      - name: SoilM_100_200cm
        levels: ["100-200 cm depth"]
        valid_range: { min: 0, max: 500 }
      - name: SoilM_0_100cm
        levels: ["0-100 cm total"]
        valid_range: { min: 0, max: 500 }
      - name: SoilM_0_200cm
        levels: ["0-200 cm total"]
        valid_range: { min: 0, max: 900 }
      - name: RootMoist
        levels: ["root zone"]
        valid_range: { min: 0, max: 900 }
    run_mode: latest

  # ===========================================================================
  # Soil Temperature (depth layers)
  # ===========================================================================

  - id: nldas-soil-temperature
    title: "NLDAS-2 Noah - Soil Temperature"
    description: "Soil temperature at 4 depth layers (0.125° hourly)"
    level_filter:
      level_type: depth_below_surface
    parameters:
      - name: SoilT_0_10cm
        levels: ["0-10 cm depth"]
        valid_range: { min: 200, max: 350 }
      - name: SoilT_10_40cm
        levels: ["10-40 cm depth"]
        valid_range: { min: 200, max: 350 }
      - name: SoilT_40_100cm
        levels: ["40-100 cm depth"]
        valid_range: { min: 200, max: 350 }
      - name: SoilT_100_200cm
        levels: ["100-200 cm depth"]
        valid_range: { min: 200, max: 350 }
    run_mode: latest

  # ===========================================================================
  # Snow
  # ===========================================================================

  - id: nldas-snow
    title: "NLDAS-2 Noah - Snow"
    description: "Snow water equivalent, depth, and cover (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: SWE
        levels: [surface]
        valid_range: { min: 0, max: 2000 }
      - name: SnowDepth
        levels: [surface]
        valid_range: { min: 0, max: 10 }
      - name: SnowFrac
        levels: [surface]
        valid_range: { min: 0, max: 1 }
    run_mode: latest

  # ===========================================================================
  # Surface Energy and Water Fluxes
  # ===========================================================================

  - id: nldas-surface
    title: "NLDAS-2 Noah - Surface Variables"
    description: "Surface temperature, albedo, canopy water, vegetation (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: AvgSurfT
        levels: [surface]
        valid_range: { min: 200, max: 350 }
      - name: Albedo
        levels: [surface]
        valid_range: { min: 0, max: 100 }
      - name: CanopInt
        levels: [surface]
        valid_range: { min: 0, max: 5 }
      - name: LAI
        levels: [surface]
        valid_range: { min: 0, max: 10 }
      - name: GVEG
        levels: [surface]
        valid_range: { min: 0, max: 1 }
    run_mode: latest

  # ===========================================================================
  # Energy Fluxes
  # ===========================================================================

  - id: nldas-energy-fluxes
    title: "NLDAS-2 Noah - Energy Fluxes"
    description: "Radiation and heat fluxes (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: SWdown
        levels: [surface]
        valid_range: { min: 0, max: 1500 }
      - name: LWdown
        levels: [surface]
        valid_range: { min: 0, max: 700 }
      - name: SWnet
        levels: [surface]
        valid_range: { min: 0, max: 1500 }
      - name: LWnet
        levels: [surface]
        valid_range: { min: -200, max: 50 }
      - name: Qle
        levels: [surface]
        valid_range: { min: -100, max: 500 }
      - name: Qh
        levels: [surface]
        valid_range: { min: -200, max: 500 }
      - name: Qg
        levels: [surface]
        valid_range: { min: -200, max: 200 }
      - name: Qf
        levels: [surface]
        valid_range: { min: -100, max: 100 }
    run_mode: latest

  # ===========================================================================
  # Water Fluxes
  # ===========================================================================

  - id: nldas-water-fluxes
    title: "NLDAS-2 Noah - Water Fluxes"
    description: "Evapotranspiration, runoff, precipitation, snowmelt (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: Evap
        levels: [surface]
        valid_range: { min: -1, max: 5 }
      - name: Qs
        levels: [surface]
        valid_range: { min: 0, max: 100 }
      - name: Qsb
        levels: [surface]
        valid_range: { min: 0, max: 100 }
      - name: Qsm
        levels: [surface]
        valid_range: { min: 0, max: 50 }
      - name: Snowf
        levels: [surface]
        valid_range: { min: 0, max: 50 }
      - name: Rainf
        levels: [surface]
        valid_range: { min: 0, max: 100 }
      - name: PotEvap
        levels: [surface]
        valid_range: { min: -100, max: 1000 }
      - name: Streamflow
        levels: [surface]
        valid_range: { min: 0, max: 50000 }
    run_mode: latest

  # ===========================================================================
  # ET Components
  # ===========================================================================

  - id: nldas-et-components
    title: "NLDAS-2 Noah - Evapotranspiration Components"
    description: "Canopy evaporation, transpiration, bare soil evaporation, sublimation (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: ECanop
        levels: [surface]
        valid_range: { min: 0, max: 200 }
      - name: TVeg
        levels: [surface]
        valid_range: { min: 0, max: 200 }
      - name: ESoil
        levels: [surface]
        valid_range: { min: 0, max: 200 }
      - name: SubSnow
        levels: [surface]
        valid_range: { min: 0, max: 200 }
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"

limits:
  max_parameters_per_request: 10
  max_time_steps: 720
  max_vertical_levels: 5
  max_response_size_mb: 100
  max_area_sq_degrees: 500
  max_area_sq_degrees_png: 3000
  max_radius_km: 750
