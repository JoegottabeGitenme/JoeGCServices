# HRRR EDR Configuration
# Defines collections grouped by level type for the OGC EDR API
#
# NOTE: The HRRR surface file (wrfsfc) contains limited isobaric data.
# To get full upper-air profiles, the pressure file (wrfprs) would need to be downloaded.
# Current configuration reflects what's available from the surface file.
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

model: hrrr

collections:
  # Full isobaric data from pressure file (wrfprs)
  - id: hrrr-isobaric
    title: "HRRR - Isobaric Levels"
    description: "Upper-air parameters on pressure levels (1000, 925, 850, 700, 500, 300, 250 hPa)"
    level_filter:
      level_type: isobaric
      level_code: 100
    parameters:
      - name: TMP
        levels: [1000, 925, 850, 700, 500, 300, 250]
        valid_range: { min: 180, max: 340 }  # Kelvin (~-93C to 67C)
      - name: HGT
        levels: [1000, 925, 850, 700, 500, 300, 250]
        valid_range: { min: 0, max: 20000 }  # geopotential meters
      - name: UGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
        valid_range: { min: -150, max: 150 }  # m/s
      - name: VGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
        valid_range: { min: -150, max: 150 }  # m/s
      - name: RH
        levels: [1000, 925, 850, 700, 500, 300, 250]
        valid_range: { min: 0, max: 100 }  # percent
    run_mode: instances

  - id: hrrr-surface
    title: "HRRR - Surface"
    description: "Surface-level parameters"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: PRES
        levels: [surface]
        valid_range: { min: 50000, max: 110000 }  # Pa (500-1100 hPa)
      - name: CAPE
        levels: [surface]
        valid_range: { min: 0, max: 10000 }  # J/kg
      - name: CIN
        levels: [surface]
        valid_range: { min: -2000, max: 0 }  # J/kg (negative)
      - name: APCP
        levels: [surface]
        valid_range: { min: 0, max: 500 }  # kg/m^2 (mm)
      - name: VIS
        levels: [surface]
        valid_range: { min: 0, max: 50000 }  # meters (0-50 km)
      - name: GUST
        levels: [surface]
        valid_range: { min: 0, max: 100 }  # m/s
    run_mode: instances

  - id: hrrr-height-agl
    title: "HRRR - Heights Above Ground"
    description: "Parameters at specific heights above ground level (2m temp/dew point/humidity/wind)"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
        valid_range: { min: 180, max: 340 }  # Kelvin
      - name: DPT
        levels: [2]
        valid_range: { min: 180, max: 320 }  # Kelvin
      - name: RH
        levels: [2]
        valid_range: { min: 0, max: 100 }  # percent
      # TODO: 10m wind not working yet - need to investigate level_value template
      # Currently only 2m values are being ingested for UGRD/VGRD
      - name: UGRD
        levels: [2]
        valid_range: { min: -150, max: 150 }  # m/s
      - name: VGRD
        levels: [2]
        valid_range: { min: -150, max: 150 }  # m/s
    run_mode: instances

  - id: hrrr-atmosphere
    title: "HRRR - Entire Atmosphere"
    description: "Column-integrated atmospheric parameters (PWAT)"
    level_filter:
      level_type: entire_atmosphere
      level_code: 200
    parameters:
      - name: PWAT
        levels: [entire_atmosphere]
        valid_range: { min: 0, max: 100 }  # kg/m^2 (mm)
      # TODO: REFC and TCDC need GRIB2 parameter code mapping fix
      # - name: REFC
      #   levels: [entire_atmosphere]
      #   valid_range: { min: -10, max: 80 }  # dBZ
      # - name: TCDC
      #   levels: [entire_atmosphere]
      #   valid_range: { min: 0, max: 100 }  # percent
    run_mode: instances

  - id: hrrr-cloud-layers
    title: "HRRR - Cloud Layers"
    description: "Cloud cover by layer (low, middle, high)"
    level_filter:
      level_type: cloud_layer
      # GRIB2 Table 4.5: 214=low cloud layer, 224=middle cloud layer, 234=high cloud layer
      # (212/222/232 are cloud *bottom* levels, not layer totals)
      level_codes: [214, 224, 234]
    parameters:
      - name: LCDC
        levels: [low_cloud_layer]
        valid_range: { min: 0, max: 100 }  # percent
      - name: MCDC
        levels: [middle_cloud_layer]
        valid_range: { min: 0, max: 100 }  # percent
      - name: HCDC
        levels: [high_cloud_layer]
        valid_range: { min: 0, max: 100 }  # percent
    run_mode: instances

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png  # 16-bit encoded PNG for GPU shaders (area queries only)
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"
  cache_policy:
    png_max_age: 3600  # 1 hour - HRRR updates hourly

limits:
  max_parameters_per_request: 10
  max_time_steps: 300
  max_vertical_levels: 20
  max_response_size_mb: 50
  max_area_sq_degrees: 100          # JSON queries (~10x10 degree area)
  max_area_sq_degrees_png: 2500     # PNG queries - full CONUS coverage (~50x50 degree)
