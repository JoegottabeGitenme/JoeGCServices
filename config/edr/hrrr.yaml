# HRRR EDR Configuration
# High-Resolution Rapid Refresh - 3km resolution CONUS coverage
#
# Coverage: CONUS (-122.7 to -60.9 lon, 21.1 to 47.8 lat)
# Resolution: 3km
# Update frequency: Hourly (every hour, 00z-23z)
#
# NOTE: Only parameters that are currently being ingested are listed here.
# See config/models/hrrr.yaml for the full parameter definitions.

model: hrrr

collections:
  # ===========================================================================
  # Instance-based collections (access all available model runs)
  # ===========================================================================
  
  # Upper-air data on pressure levels
  - id: hrrr-isobaric
    title: "HRRR - Isobaric Levels"
    description: "Upper-air parameters on pressure levels (1000, 925, 850, 700, 500, 300, 250 hPa)"
    level_filter:
      level_type: isobaric
      level_code: 100
    parameters:
      - name: TMP
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: HGT
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: UGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: VGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: RH
        levels: [1000, 925, 850, 700, 500, 300, 250]
    run_mode: instances

  # Surface-level parameters
  - id: hrrr-surface
    title: "HRRR - Surface"
    description: "Surface-level parameters including pressure, precipitation, convective indices, and visibility"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: PRES
        levels: [surface]
      - name: CAPE
        levels: [surface]
      - name: CIN
        levels: [surface]
      - name: APCP
        levels: [surface]
      - name: VIS
        levels: [surface]
      - name: GUST
        levels: [surface]
    run_mode: instances

  # Parameters at specific heights above ground level
  - id: hrrr-height-agl
    title: "HRRR - Heights Above Ground"
    description: "Parameters at specific heights above ground level (2m temp/humidity, 10m wind)"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
      - name: DPT
        levels: [2]
      - name: RH
        levels: [2]
      - name: UGRD
        levels: [10]
      - name: VGRD
        levels: [10]
    run_mode: instances

  # Column-integrated atmospheric parameters
  - id: hrrr-atmosphere
    title: "HRRR - Entire Atmosphere"
    description: "Column-integrated atmospheric parameters (precipitable water, cloud cover, reflectivity)"
    level_filter:
      level_type: entire_atmosphere
      level_code: 200
    parameters:
      - name: PWAT
        levels: [entire_atmosphere]
      - name: REFC
        levels: [entire_atmosphere]
      - name: TCDC
        levels: [entire_atmosphere]
    run_mode: instances

  # Cloud cover by layer
  - id: hrrr-cloud-layers
    title: "HRRR - Cloud Layers"
    description: "Cloud cover by layer (low, middle, high)"
    level_filter:
      level_type: cloud_layer
      # GRIB2 Table 4.5: 214=low cloud layer, 224=middle cloud layer, 234=high cloud layer
      level_codes: [214, 224, 234]
    parameters:
      - name: LCDC
        levels: [low_cloud_layer]
      - name: MCDC
        levels: [middle_cloud_layer]
      - name: HCDC
        levels: [high_cloud_layer]
    run_mode: instances

  # ===========================================================================
  # Latest-only collections (quick access to most recent model run)
  # These use the non-instance endpoints for simpler access patterns:
  #   GET /edr/collections/hrrr-surface-latest/position?coords=POINT(-100 40)
  # ===========================================================================
  
  - id: hrrr-isobaric-latest
    title: "HRRR - Isobaric Levels (Latest)"
    description: "Most recent upper-air data on pressure levels"
    level_filter:
      level_type: isobaric
      level_code: 100
    parameters:
      - name: TMP
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: HGT
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: UGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: VGRD
        levels: [1000, 925, 850, 700, 500, 300, 250]
      - name: RH
        levels: [1000, 925, 850, 700, 500, 300, 250]
    run_mode: latest

  - id: hrrr-surface-latest
    title: "HRRR - Surface (Latest)"
    description: "Most recent surface-level data"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: PRES
        levels: [surface]
      - name: CAPE
        levels: [surface]
      - name: CIN
        levels: [surface]
      - name: APCP
        levels: [surface]
      - name: VIS
        levels: [surface]
      - name: GUST
        levels: [surface]
    run_mode: latest

  - id: hrrr-height-agl-latest
    title: "HRRR - Heights Above Ground (Latest)"
    description: "Most recent data at specific heights above ground"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      - name: TMP
        levels: [2]
      - name: DPT
        levels: [2]
      - name: RH
        levels: [2]
      - name: UGRD
        levels: [10]
      - name: VGRD
        levels: [10]
    run_mode: latest

  - id: hrrr-atmosphere-latest
    title: "HRRR - Entire Atmosphere (Latest)"
    description: "Most recent column-integrated data"
    level_filter:
      level_type: entire_atmosphere
      level_code: 200
    parameters:
      - name: PWAT
        levels: [entire_atmosphere]
      - name: REFC
        levels: [entire_atmosphere]
      - name: TCDC
        levels: [entire_atmosphere]
    run_mode: latest

  - id: hrrr-cloud-layers-latest
    title: "HRRR - Cloud Layers (Latest)"
    description: "Most recent cloud cover by layer"
    level_filter:
      level_type: cloud_layer
      level_codes: [214, 224, 234]
    parameters:
      - name: LCDC
        levels: [low_cloud_layer]
      - name: MCDC
        levels: [middle_cloud_layer]
      - name: HCDC
        levels: [high_cloud_layer]
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png  # 16-bit encoded PNG for GPU shaders (area queries only)
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"

# Response size limits
# HRRR is 3km resolution (~0.027°), so area queries return many more points than GFS
# A 100 sq degree query returns ~137,000 points (vs ~1,600 for GFS at 0.25°)
limits:
  max_parameters_per_request: 10
  max_time_steps: 48              # 48 hours of forecast data
  max_vertical_levels: 20         # Accommodates all 7 isobaric levels
  max_response_size_mb: 50        # Lower than GFS due to higher resolution
  max_area_sq_degrees: 100        # ~1000km x 1000km (stricter due to resolution)
  max_radius_km: 500              # Smaller radius due to high point density
