# NLDAS-2 Forcing Data - EDR Configuration
# Meteorological forcing observation data from NASA GES DISC
#
# Key differences from NWP models:
# - No forecast hours (observation data)
# - Mix of surface and height-above-ground variables
# - Instances represent observation timestamps, not model runs
# - Updates hourly with ~4 day latency
#
# Coverage: CONUS + Southern Canada (-125 to -67 lon, 25 to 53 lat)
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

model: nldas-forcing
data_type: observation

collections:
  # ===========================================================================
  # All Forcing Variables
  # ===========================================================================

  - id: nldas-forcing
    title: "NLDAS-2 Forcing"
    description: "Meteorological forcing: precip, temperature, humidity, wind, radiation (0.125° hourly)"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      - name: APCP
        levels: [surface]
        valid_range: { min: 0, max: 0.1 }
      - name: TMP2M
        levels: ["2 m above ground"]
        valid_range: { min: 180, max: 350 }
      - name: SPFH2M
        levels: ["2 m above ground"]
        valid_range: { min: 0, max: 0.1 }
      - name: PRES
        levels: [surface]
        valid_range: { min: 50000, max: 110000 }
      - name: WIND
        levels: ["10 m above ground"]
        valid_range: { min: 0, max: 100 }
      - name: DSWRF
        levels: [surface]
        valid_range: { min: 0, max: 1500 }
      - name: DLWRF
        levels: [surface]
        valid_range: { min: 0, max: 700 }
      - name: CAPE
        levels: [surface]
        valid_range: { min: 0, max: 10000 }
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"

limits:
  max_parameters_per_request: 10
  max_time_steps: 720
  max_vertical_levels: 5
  max_response_size_mb: 100
  max_area_sq_degrees: 500
  max_area_sq_degrees_png: 3000
  max_radius_km: 750
