# GOES-18 (GOES West) EDR Configuration
# Observation data from geostationary satellite
#
# Key differences from NWP models:
# - No forecast hours (observation data)
# - No vertical levels (all data at top-of-atmosphere)
# - Instances represent observation timestamps, not model runs
# - Updates every ~5 minutes
#
# Coverage: Western CONUS, Pacific (-175 to -100 lon, 14.5 to 55.5 lat)

model: goes18
data_type: observation

collections:
  # ===========================================================================
  # Instance-based collections (access all available observation timestamps)
  # ===========================================================================
  
  # Visible bands (bands 1, 2, 3) - daytime only
  - id: goes18-visible
    title: "GOES-18 Visible Imagery"
    description: "Visible reflectance bands (0.47-0.86µm). Best during daytime."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C01
        levels: [visible_blue]
      - name: CMI_C02
        levels: [visible_red]
      - name: CMI_C03
        levels: [visible_veggie]
    run_mode: instances

  # Water vapor bands (bands 8, 9, 10)
  - id: goes18-water-vapor
    title: "GOES-18 Water Vapor"
    description: "Water vapor channel brightness temperatures (6.2-7.3µm). Available day and night."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C08
        levels: [upper_vapor]
      - name: CMI_C09
        levels: [mid_vapor]
      - name: CMI_C10
        levels: [low_vapor]
    run_mode: instances

  # Infrared bands (bands 13, 14)
  - id: goes18-infrared
    title: "GOES-18 Infrared"
    description: "Longwave IR brightness temperature (10.3-11.2µm). Available day and night."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C13
        levels: [clean_ir]
      - name: CMI_C14
        levels: [ir]
    run_mode: instances

  # ===========================================================================
  # Latest-only collections (quick access to most recent data)
  # These use the non-instance endpoints for simpler access patterns:
  #   GET /edr/collections/goes18-infrared-latest/position?coords=POINT(-120 35)
  # ===========================================================================
  
  - id: goes18-visible-latest
    title: "GOES-18 Visible (Latest)"
    description: "Most recent visible imagery. Daytime only."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C01
        levels: [visible_blue]
      - name: CMI_C02
        levels: [visible_red]
      - name: CMI_C03
        levels: [visible_veggie]
    run_mode: latest

  - id: goes18-water-vapor-latest
    title: "GOES-18 Water Vapor (Latest)"
    description: "Most recent water vapor imagery."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C08
        levels: [upper_vapor]
      - name: CMI_C09
        levels: [mid_vapor]
      - name: CMI_C10
        levels: [low_vapor]
    run_mode: latest

  - id: goes18-infrared-latest
    title: "GOES-18 Infrared (Latest)"
    description: "Most recent IR imagery."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C13
        levels: [clean_ir]
      - name: CMI_C14
        levels: [ir]
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png  # 16-bit encoded PNG for GPU shaders (area queries only)
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 300  # 5 minutes - GOES updates every ~5 minutes

limits:
  max_parameters_per_request: 10
  max_time_steps: 36          # ~3 hours at 5-min intervals
  max_vertical_levels: 1      # No vertical dimension for satellite data
  max_response_size_mb: 100   # GOES grids are large (~5000x3000)
  max_area_sq_degrees: 50     # Limit area queries due to high resolution
  max_radius_km: 250          # Limit radius queries
