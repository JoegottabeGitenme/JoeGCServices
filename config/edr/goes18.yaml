# GOES-18 (GOES West) EDR Configuration
# Observation data from geostationary satellite
#
# Key differences from NWP models:
# - No forecast hours (observation data)
# - No vertical levels (all data at top-of-atmosphere)
# - Instances represent observation timestamps, not model runs
# - Updates every ~5 minutes
#
# Coverage: Western CONUS, Pacific (-175 to -100 lon, 14.5 to 55.5 lat)
#
# valid_range: Used for PNG encoding to ensure consistent colormap rendering
# across different viewport regions. Values are in the parameter's native units.

# Data diet (2026-10-29): only bands 2 (red visible) and 13 (clean IR) are downloaded and
# ingested (source.bands in config/models/goes18.yaml). Water vapor collections and
# bands 1, 3, 8, 9, 10, 14 were removed.

model: goes18
data_type: observation

collections:
  # ===========================================================================
  # Instance-based collections (access all available observation timestamps)
  # ===========================================================================
  
  # Visible band (band 2) - daytime only
  - id: goes18-visible
    title: "GOES-18 Visible Imagery"
    description: "Red visible reflectance, band 2 (0.64µm). Best during daytime."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C02
        levels: [visible_red]
        valid_range: { min: 0, max: 1.5 }  # reflectance factor
    run_mode: instances

  # Infrared band (band 13)
  - id: goes18-infrared
    title: "GOES-18 Infrared"
    description: "Clean longwave IR brightness temperature, band 13 (10.3µm). Available day and night."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C13
        levels: [clean_ir]
        valid_range: { min: 180, max: 350 }  # Kelvin
    run_mode: instances

  # ===========================================================================
  # Latest-only collections (quick access to most recent data)
  # These use the non-instance endpoints for simpler access patterns:
  #   GET /edr/collections/goes18-infrared-latest/position?coords=POINT(-120 35)
  # ===========================================================================
  
  - id: goes18-visible-latest
    title: "GOES-18 Visible (Latest)"
    description: "Most recent red visible imagery (band 2). Daytime only."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C02
        levels: [visible_red]
        valid_range: { min: 0, max: 1.5 }
    run_mode: latest

  - id: goes18-infrared-latest
    title: "GOES-18 Infrared (Latest)"
    description: "Most recent clean IR imagery (band 13)."
    level_filter:
      level_type: top_of_atmosphere
      level_code: 8
    parameters:
      - name: CMI_C13
        levels: [clean_ir]
        valid_range: { min: 180, max: 350 }
    run_mode: latest

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png  # 16-bit encoded PNG for GPU shaders (area queries only)
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
    - "EPSG:4326"
    - "EPSG:3857"
  cache_policy:
    png_max_age: 300  # 5 minutes - GOES updates every ~5 minutes

limits:
  max_parameters_per_request: 10
  max_time_steps: 350          # ~3 hours at 5-min intervals
  max_vertical_levels: 1      # No vertical dimension for satellite data
  max_response_size_mb: 100   # GOES grids are large (~5000x3000)
  max_area_sq_degrees: 50     # Limit area queries due to high resolution
  max_area_sq_degrees_png: 2500  # PNG queries - larger coverage for visualization
  max_radius_km: 250          # Limit radius queries
