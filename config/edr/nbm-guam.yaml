# NBM Guam EDR Configuration
# Defines collections organized by vertical level for the OGC EDR API
#
# Collections are organized by vertical level type (consistent with GFS/HRRR):
# - surface: Parameters at the surface level
# - height-agl: Parameters at heights above ground level
# - cloud: Cloud-related parameters (ceiling, cloud cover)

model: nbm-guam

collections:
  # ==========================================================================
  # Surface Level Parameters
  # ==========================================================================
  - id: nbm-guam-surface
    title: "NBM Guam - Surface"
    description: "Surface-level parameters including precipitation and visibility"
    level_filter:
      level_type: surface
      level_code: 1
    parameters:
      # Precipitation
      - name: APCP01
        levels: [surface]
      - name: APCP06
        levels: [surface]
      - name: POP06
        levels: [surface]
      # Visibility
      - name: VIS
        levels: [surface]
    run_mode: instances

  # ==========================================================================
  # Heights Above Ground Level
  # ==========================================================================
  - id: nbm-guam-height-agl
    title: "NBM Guam - Heights Above Ground"
    description: "Parameters at heights above ground level (2m temp/humidity, 10m wind)"
    level_filter:
      level_type: height_above_ground
      level_code: 103
    parameters:
      # 2m temperature and humidity
      - name: TMP
        levels: [2]
      - name: DPT
        levels: [2]
      - name: TMAX
        levels: [2]
      - name: TMIN
        levels: [2]
      - name: RH
        levels: [2]
      # 10m wind
      - name: WIND
        levels: [10]
      - name: UGRD
        levels: [10]
      - name: VGRD
        levels: [10]
      - name: WDIR
        levels: [10]
      - name: GUST
        levels: [10]
    run_mode: instances

  # ==========================================================================
  # Cloud and Atmospheric Parameters
  # ==========================================================================
  - id: nbm-guam-cloud
    title: "NBM Guam - Cloud"
    description: "Cloud parameters including ceiling and total cloud cover"
    level_filter:
      level_type: mixed
    parameters:
      - name: CEIL
        levels: [cloud_base]
      - name: TCDC
        levels: [entire_atmosphere]
    run_mode: instances

settings:
  output_formats:
    - application/vnd.cov+json
    - application/geo+json
    - image/png
  default_crs: "CRS:84"
  supported_crs:
    - "CRS:84"
  cache_policy:
    png_max_age: 3600

limits:
  max_parameters_per_request: 10
  max_time_steps: 48
  max_vertical_levels: 10
  max_response_size_mb: 50
  max_area_sq_degrees: 25
  max_area_sq_degrees_png: 100
